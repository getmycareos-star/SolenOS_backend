name: Alembic baseline preview

on:
  push:
    branches:
      - fix/systematic-remediation
    paths:
      - "backend/app/**"
      - "backend/pyproject.toml"
      - "backend/alembic.ini"
      - "backend/alembic/**"
      - ".github/workflows/alembic-baseline-preview.yml"

permissions:
  contents: write

jobs:
  generate-baseline-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and migration dependencies
        run: python -m pip install -e "backend/.[test]"

      - name: Generate and apply baseline on a disposable empty SQLite database
        env:
          DATABASE_URL: sqlite:///./backend/alembic-preview.db
          PYTHONPATH: backend:.
        run: |
          rm -f backend/alembic-preview.db
          if compgen -G "backend/alembic/versions/0001_initial_schema_*.py" > /dev/null; then
            echo "Using committed baseline migration for validation."
          else
            python -m alembic -c backend/alembic.ini revision --autogenerate --rev-id 0001_initial_schema -m "initial schema baseline"
          fi
          python - <<'PY'
          import re
          from pathlib import Path
          from app.core.database import Base
          import app.main  # register all runtime API model modules

          migration_files = list(Path("backend/alembic/versions").glob("*.py"))
          assert len(migration_files) == 1, f"Expected one generated baseline, got {len(migration_files)}"
          migration_text = migration_files[0].read_text(encoding="utf-8")
          created_tables = set(re.findall(r"op\.create_table\(\s*['\"]([^'\"]+)", migration_text))
          expected_tables = set(Base.metadata.tables)
          missing = expected_tables - created_tables
          assert not missing, f"Baseline omits metadata tables: {sorted(missing)}"
          print(f"Baseline includes create operations for all {len(expected_tables)} registered tables.")
          PY
          python -m alembic -c backend/alembic.ini upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["DATABASE_URL"])
          tables = set(inspect(engine).get_table_names())
          required = {"persons", "vital_signs", "evidence"}
          missing = required - tables
          assert not missing, f"Migration omitted required tables: {sorted(missing)}"
          assert "alembic_version" in tables, "Alembic version table was not created"
          print(f"Migration baseline created {len(tables)} tables; required tables present.")
          engine.dispose()
          PY

      - name: Commit validated baseline migration to remediation branch
        if: success()
        run: |
          if git ls-files --error-unmatch backend/alembic/versions/0001_initial_schema_initial_schema_baseline.py >/dev/null 2>&1; then
            echo "Baseline is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/alembic/versions/0001_initial_schema_initial_schema_baseline.py
          git commit -m "chore: add validated Alembic baseline migration"
          git push origin HEAD:fix/systematic-remediation

      - name: Upload generated migration for review
        uses: actions/upload-artifact@v4
        with:
          name: alembic-baseline-preview
          path: backend/alembic/versions/*.py
          if-no-files-found: error
          retention-days: 3
