name: Messy-care benchmark gate

on:
  # Gate every proposed change before it can reach main, then re-run after merge.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messy-care-contract:
    name: Messy-care adversarial contract benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx

      - name: Run adversarial messy-care contract suite
        id: benchmark
        continue-on-error: true
        run: |
          python -m pytest \
            backend/tests/test_situation_understanding_benchmark.py \
            backend/tests/test_messy_care_10000_scenarios.py \
            backend/tests/test_longitudinal_messy_care_benchmark.py \
            backend/tests/test_longitudinal_change_benchmark.py \
            backend/tests/test_open_loop_messy_scenarios.py \
            backend/tests/test_situation_temporal_provenance.py \
            backend/tests/test_evidence_lineage.py \
            backend/tests/test_evidence_review_persistence.py \
            backend/tests/test_care_continuity_link_validation.py \
            backend/tests/test_uncertainty_benchmark.py \
            backend/tests/test_situation.py \
            backend/tests/test_uncertainty.py \
            backend/tests/test_appointment_workspace.py \
            backend/tests/test_persisted_capture_review.py \
            -q -s --junitxml=/tmp/messy-care-contract.xml

      - name: Enforce complete benchmark execution
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "/tmp/messy-care-contract.xml"
          if not os.path.exists(report):
              raise SystemExit("Messy-care benchmark report missing; no pass can be claimed.")
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          executed = tests - skipped
          passed = executed - failures - errors
          print(f"MESSY_CARE_CASES_DECLARED={tests}")
          print(f"MESSY_CARE_CASES_EXECUTED={executed}")
          print(f"MESSY_CARE_CASES_PASSED={passed}")
          print(f"MESSY_CARE_CASES_FAILED={failures}")
          print(f"MESSY_CARE_CASES_ERRORED={errors}")
          print(f"MESSY_CARE_CASES_SKIPPED={skipped}")
          if tests < 10000 or not executed or failures or errors or skipped:
              raise SystemExit(
                  "Messy-care gate failed: require at least 10,000 declared scenarios, "
                  "nonzero execution, and zero failures, errors, or skips."
              )
          PY
          test "${{ steps.benchmark.outcome }}" = "success"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messy-care-contract-junit
          path: /tmp/messy-care-contract.xml
          if-no-files-found: error
          retention-days: 30

  postgres-longitudinal-integration:
    name: PostgreSQL longitudinal persistence benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_benchmark
          POSTGRES_PASSWORD: solenos_benchmark_ci
          POSTGRES_DB: solenos_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_benchmark -d solenos_benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SOLENOS_BENCHMARK_DATABASE_URL: postgresql+psycopg2://solenos_benchmark:solenos_benchmark_ci@localhost:5432/solenos_benchmark
      DATABASE_URL: postgresql+psycopg2://solenos_benchmark:solenos_benchmark_ci@localhost:5432/solenos_benchmark
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx psycopg2-binary

      - name: Apply the reviewed PostgreSQL migration chain
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Run PostgreSQL integration and 10,000-record corpus
        id: postgres_benchmark
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest backend/tests/test_pattern_postgres_integration.py backend/tests/test_longitudinal_messy_care_benchmark.py backend/tests/test_messy_care_10000_postgres.py -q -s --junitxml=/tmp/postgres-longitudinal.xml | tee /tmp/postgres-longitudinal.log

      - name: Verify PostgreSQL data survives server restart
        if: steps.postgres_benchmark.outcome == 'success'
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time
          import psycopg2

          dsn = os.environ["DATABASE_URL"].replace("postgresql+psycopg2://", "postgresql://", 1)
          probe_id = os.environ["GITHUB_SHA"]
          with psycopg2.connect(dsn) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      CREATE TABLE IF NOT EXISTS messy_care_restart_probe (
                          probe_id text PRIMARY KEY,
                          verified_at timestamptz NOT NULL DEFAULT now()
                      )
                  """)
                  cursor.execute("""
                      INSERT INTO messy_care_restart_probe (probe_id)
                      VALUES (%s)
                      ON CONFLICT (probe_id) DO UPDATE SET verified_at = now()
                  """, (probe_id,))

          containers = subprocess.check_output(
              ["docker", "ps", "--filter", "ancestor=postgres:17", "--format", "{{.ID}}"],
              text=True,
          ).strip().splitlines()
          if not containers:
              raise SystemExit("PostgreSQL service container was not found.")
          subprocess.run(["docker", "restart", containers[0]], check=True)

          last_error = None
          for _ in range(30):
              try:
                  with psycopg2.connect(dsn, connect_timeout=2) as connection:
                      with connection.cursor() as cursor:
                          cursor.execute(
                              "SELECT probe_id FROM messy_care_restart_probe WHERE probe_id = %s",
                              (probe_id,),
                          )
                          row = cursor.fetchone()
                          if row and row[0] == probe_id:
                              print("POSTGRES_RESTART_PERSISTENCE=PASS")
                              break
              except Exception as error:
                  last_error = error
                  time.sleep(2)
          else:
              raise SystemExit(f"PostgreSQL restart persistence failed: {last_error}")
          PY

      - name: Enforce PostgreSQL benchmark execution
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = "/tmp/postgres-longitudinal.xml"
          log = Path("/tmp/postgres-longitudinal.log")
          if not os.path.exists(report) or not log.exists():
              raise SystemExit("PostgreSQL benchmark evidence missing; no pass can be claimed.")
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          output = log.read_text(encoding="utf-8")
          required_markers = (
              "MESSY_CARE_POSTGRES_CASES_DECLARED=10000",
              "MESSY_CARE_POSTGRES_CASES_PERSISTED=10000",
              "MESSY_CARE_POSTGRES_HISTORIES=1000",
              "MESSY_CARE_POSTGRES_FRESH_SESSION_RETRIEVAL=PASS",
          )
          missing = [marker for marker in required_markers if marker not in output]
          print(f"POSTGRES_TESTS_DECLARED={tests}")
          print(f"POSTGRES_TESTS_FAILED={failures}")
          print(f"POSTGRES_TESTS_ERRORED={errors}")
          print(f"POSTGRES_TESTS_SKIPPED={skipped}")
          print(f"POSTGRES_10000_RECORD_MARKERS_MISSING={missing}")
          if not tests or failures or errors or skipped or missing:
              raise SystemExit("PostgreSQL 10,000-record persistence benchmark gate failed.")
          PY
          test "${{ steps.postgres_benchmark.outcome }}" = "success"

      - name: Upload PostgreSQL benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messy-care-postgres-junit
          path: /tmp/postgres-longitudinal.xml
          if-no-files-found: error
          retention-days: 30
