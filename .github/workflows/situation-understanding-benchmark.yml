name: Messy-care benchmark gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messy-care-contract:
    name: Messy-care adversarial contract benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx

      - name: Run adversarial messy-care contract suite
        id: benchmark
        continue-on-error: true
        run: |
          python -m pytest backend/tests/test_situation_thread_source_isolation.py backend/tests/test_situation_understanding_benchmark.py backend/tests/test_messy_care_10000_scenarios.py backend/tests/test_longitudinal_messy_care_benchmark.py backend/tests/test_longitudinal_change_benchmark.py backend/tests/test_open_loop_messy_scenarios.py backend/tests/test_situation_temporal_provenance.py backend/tests/test_evidence_lineage.py backend/tests/test_evidence_review_persistence.py backend/tests/test_care_continuity_link_validation.py backend/tests/test_uncertainty_benchmark.py backend/tests/test_situation.py backend/tests/test_uncertainty.py backend/tests/test_appointment_workspace.py backend/tests/test_persisted_capture_review.py backend/tests/test_anonymous_sessions.py backend/tests/test_identity_security.py -q -s --junitxml=/tmp/messy-care-contract.xml

      - name: Enforce complete benchmark execution
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "/tmp/messy-care-contract.xml"
          if not os.path.exists(report):
              raise SystemExit("Messy-care benchmark report missing; no pass can be claimed.")
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          executed = tests - skipped
          passed = executed - failures - errors
          corpus_cases = sum(
              1 for case in root.iter("testcase")
              if case.attrib.get("name", "").startswith(
                  "test_10000_adversarial_messy_care_scenarios["
              )
          )
          print(f"MESSY_CARE_10000_INDIVIDUAL_CASES={corpus_cases}")
          print(f"MESSY_CARE_CASES_DECLARED={tests}")
          print(f"MESSY_CARE_CASES_EXECUTED={executed}")
          print(f"MESSY_CARE_CASES_PASSED={passed}")
          print(f"MESSY_CARE_CASES_FAILED={failures}")
          print(f"MESSY_CARE_CASES_ERRORED={errors}")
          print(f"MESSY_CARE_CASES_SKIPPED={skipped}")
          if corpus_cases != 10000 or tests < 10000 or not executed or failures or errors or skipped:
              raise SystemExit(
                  "Messy-care gate failed: require all 10,000 individual scenarios, "
                  "nonzero execution, and zero failures, errors, or skips."
              )
          PY
          test "${{ steps.benchmark.outcome }}" = "success"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messy-care-contract-junit
          path: /tmp/messy-care-contract.xml
          if-no-files-found: error
          retention-days: 30

  postgres-longitudinal-integration:
    name: PostgreSQL longitudinal persistence benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_benchmark
          POSTGRES_PASSWORD: solenos_benchmark_ci
          POSTGRES_DB: solenos_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_benchmark -d solenos_benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SOLENOS_BENCHMARK_DATABASE_URL: postgresql+psycopg2://solenos_benchmark:solenos_benchmark_ci@localhost:5432/solenos_benchmark
      DATABASE_URL: postgresql+psycopg2://solenos_benchmark:solenos_benchmark_ci@localhost:5432/solenos_benchmark
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx psycopg2-binary

      - name: Apply the reviewed PostgreSQL migration chain
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Run PostgreSQL integration before disposable schema tests
        id: postgres_benchmark
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest backend/tests/test_pattern_postgres_integration.py backend/tests/test_messy_care_10000_postgres.py backend/tests/test_messy_care_10000_api_postgres.py backend/tests/test_capture_to_lcr_10000_postgres.py backend/tests/test_longitudinal_messy_care_benchmark.py -q -s --junitxml=/tmp/postgres-longitudinal.xml | tee /tmp/postgres-messy-care.log

      - name: Verify persisted care history survives PostgreSQL server restart
        id: postgres_restart
        if: steps.postgres_benchmark.outcome == 'success'
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time
          from datetime import datetime, timezone

          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker
          from app.models.care import Person, Caregiver, CareEvent, Evidence, Correction
          from app.models.care_continuity import CareAssertion
          from app.models.uncertainty import Contradiction, OpenQuestion

          dsn = os.environ["DATABASE_URL"]
          suffix = os.environ["GITHUB_SHA"][:12]
          person_id = f"restart-person-{suffix}"
          caregiver_id = f"restart-caregiver-{suffix}"
          event_id = f"restart-care-event-{suffix}"
          engine = create_engine(dsn, pool_pre_ping=True)
          Session = sessionmaker(bind=engine, expire_on_commit=False)

          with Session() as db:
              db.add(Person(id=person_id, name="PostgreSQL restart persistence fixture"))
              db.flush()
              db.add(Caregiver(
                  id=caregiver_id,
                  name="Restart persistence caregiver",
                  relationship="family",
                  person_id=person_id,
              ))
              db.flush()
              occurred_at = datetime(2026, 10, 29, 8, 15, tzinfo=timezone.utc)
              source_id = "restart-source-" + suffix
              assertion_id = "restart-assertion-" + suffix
              contradiction_id = "restart-conflict-" + suffix
              correction_id = "restart-correction-" + suffix
              question_id = "restart-question-" + suffix
              db.add(Evidence(
                  id=source_id,
                  person_id=person_id,
                  type="caregiver_report",
                  source_text="Caregiver reports a mobility concern; later correction remains auditable.",
                  uploaded_by_caregiver_id=caregiver_id,
                  reported_by_caregiver_id=caregiver_id,
                  reported_by_label="Daughter",
                  original_author="Daughter",
                  collected_by_caregiver_id=caregiver_id,
                  occurred_at=occurred_at,
                  reported_at=datetime(2026, 10, 30, 8, 15, tzinfo=timezone.utc),
                  evidence_status="reported",
                  source_type="caregiver_report",
              ))
              db.flush()
              db.add(CareEvent(
                  id=event_id,
                  person_id=person_id,
                  event_type="mobility",
                  status="recorded",
                  occurred_at=occurred_at,
                  title="Persisted care event restart probe",
                  evidence_ids=[source_id],
                  created_by_caregiver_id=caregiver_id,
              ))
              db.flush()
              db.add(CareAssertion(
                  id=assertion_id,
                  person_id=person_id,
                  subject_type="mobility",
                  subject_id="walking",
                  field="reported_status",
                  assertion_kind="event",
                  asserted_value="reported_present",
                  source_event_id=event_id,
                  source_label="Daughter",
                  source_text="Needed support when walking.",
                  evidence_ids=[source_id],
                  assertion_status="reported",
                  observed_at=occurred_at,
                  created_by_caregiver_id=caregiver_id,
              ))
              db.flush()
              db.add(Contradiction(
                  id=contradiction_id,
                  person_id=person_id,
                  subject_type="mobility",
                  subject_id="walking",
                  field="reported_status",
                  description="Conflicting accounts remain unresolved after restart.",
                  matching_candidate_ids=[assertion_id, "independent-counter-claim"],
                  evidence_ids=[source_id],
                  source_assertion_ids=[assertion_id, "independent-counter-claim"],
                  resolution_status="unresolved",
              ))
              db.add(Correction(
                  id=correction_id,
                  person_id=person_id,
                  target_type="care_assertion",
                  target_id=assertion_id,
                  original_text="reported_present",
                  corrected_text="report remains unverified pending review",
                  reason="Caregiver correction retained as a separate lineage record.",
                  caregiver_id=caregiver_id,
              ))
              db.add(OpenQuestion(
                  id=question_id,
                  person_id=person_id,
                  question="Was walking support also needed the following morning?",
                  subject_type="mobility",
                  subject_id="walking",
                  status="open",
                  evidence_ids=[source_id],
                  created_by_caregiver_id=caregiver_id,
              ))
              db.commit()
          engine.dispose()

          container_rows = subprocess.check_output(
              ["docker", "ps", "-a", "--format", "{{.ID}} {{.Image}}"],
              text=True,
          ).strip().splitlines()
          containers = [
              row.split(maxsplit=1)[0]
              for row in container_rows
              if len(row.split(maxsplit=1)) == 2 and "postgres" in row.split(maxsplit=1)[1].lower()
          ]
          if not containers:
              raise SystemExit(
                  "PostgreSQL service container was not found; "
                  f"visible containers: {container_rows}"
              )
          subprocess.run(["docker", "restart", containers[0]], check=True)

          last_error = None
          for _ in range(30):
              try:
                  restarted_engine = create_engine(
                      dsn, pool_pre_ping=True, connect_args={"connect_timeout": 2}
                  )
                  RestartedSession = sessionmaker(bind=restarted_engine, expire_on_commit=False)
                  with RestartedSession() as db:
                      event = db.query(CareEvent).filter_by(
                          id=event_id, person_id=person_id
                      ).one()
                      assert event.created_by_caregiver_id == caregiver_id
                      assert event.evidence_ids == [source_id]
                      assert event.title == "Persisted care event restart probe"
                      evidence = db.query(Evidence).filter_by(
                          id=source_id, person_id=person_id
                      ).one()
                      assert evidence.uploaded_by_caregiver_id == caregiver_id
                      assert evidence.reported_by_caregiver_id == caregiver_id
                      assert evidence.reported_by_label == "Daughter"
                      assert evidence.source_text_sha256
                      assertion = db.query(CareAssertion).filter_by(
                          id=assertion_id, person_id=person_id
                      ).one()
                      assert assertion.source_event_id == event_id
                      assert assertion.evidence_ids == [source_id]
                      assert assertion.source_label == "Daughter"
                      conflict = db.query(Contradiction).filter_by(
                          id=contradiction_id, person_id=person_id
                      ).one()
                      assert conflict.resolution_status == "unresolved"
                      assert conflict.source_assertion_ids == [
                          assertion_id, "independent-counter-claim"
                      ]
                      correction = db.query(Correction).filter_by(
                          id=correction_id, person_id=person_id
                      ).one()
                      assert correction.original_text == "reported_present"
                      assert correction.corrected_text == "report remains unverified pending review"
                      question = db.query(OpenQuestion).filter_by(
                          id=question_id, person_id=person_id
                      ).one()
                      assert question.status == "open"
                      assert question.question.startswith("Was walking support")
                      caregiver = db.query(Caregiver).filter_by(
                          id=caregiver_id, person_id=person_id
                      ).one()
                      assert caregiver.id == caregiver_id
                      print("POSTGRES_CARE_EVENT_FRESH_SESSION_AFTER_RESTART=PASS")
                      print("POSTGRES_EVIDENCE_ATTRIBUTION_AFTER_RESTART=PASS")
                      print("POSTGRES_CONTRADICTION_AFTER_RESTART=PASS")
                      print("POSTGRES_CORRECTION_LINEAGE_AFTER_RESTART=PASS")
                      print("POSTGRES_OPEN_QUESTION_AFTER_RESTART=PASS")
                  restarted_engine.dispose()
                  break
              except Exception as error:
                  last_error = error
                  time.sleep(2)
          else:
              raise SystemExit(f"PostgreSQL care-history restart persistence failed: {last_error}")
          PY

      - name: Enforce PostgreSQL benchmark execution
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "/tmp/postgres-longitudinal.xml"
          if not os.path.exists(report):
              raise SystemExit("PostgreSQL benchmark report missing; no pass can be claimed.")
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          print(f"POSTGRES_MESSY_CARE_CASES_DECLARED={tests}")
          print(f"POSTGRES_MESSY_CARE_CASES_FAILED={failures}")
          print(f"POSTGRES_MESSY_CARE_CASES_ERRORED={errors}")
          print(f"POSTGRES_MESSY_CARE_CASES_SKIPPED={skipped}")
          log = open("/tmp/postgres-messy-care.log", encoding="utf-8").read()
          required_markers = (
              "MESSY_CARE_POSTGRES_CASES_DECLARED=10000",
              "MESSY_CARE_POSTGRES_CASES_PERSISTED=10000",
              "MESSY_CARE_POSTGRES_HISTORIES=1000",
              "MESSY_CARE_POSTGRES_FAMILIES=20",
              "MESSY_CARE_POSTGRES_FRESH_SESSION_RETRIEVAL=PASS",
              "MESSY_CARE_POSTGRES_API_SCENARIOS_EXECUTED=10000",
              "MESSY_CARE_POSTGRES_API_ASSESSMENTS_RETRIEVED=10000",
              "MESSY_CARE_POSTGRES_API_FRESH_HTTP_SESSION=PASS",
              "MESSY_CARE_POSTGRES_API_CROSS_PERSON_ISOLATION=PASS",
              "CAPTURE_TO_LCR_JOURNEYS_EXECUTED=10000",
              "CAPTURE_TO_LCR_ATTRIBUTION=PASS",
              "CAPTURE_TO_LCR_OBSERVER_SUBJECT_ATTRIBUTION=PASS",
              "CAPTURE_TO_LCR_CONTRADICTIONS_PRESERVED=PASS",
              "CAPTURE_TO_LCR_CORRECTION_LINEAGE=PASS",
              "CAPTURE_TO_LCR_HISTORICAL_RECONSTRUCTION=PASS",
              "CAPTURE_TO_LCR_DELAYED_EVIDENCE_TIME=PASS",
              "CAPTURE_TO_LCR_LCR_RETRIEVAL=PASS",
              "CAPTURE_TO_LCR_ACCESS_ISOLATION=PASS",
          )
          missing = [marker for marker in required_markers if marker not in log]
          print(f"POSTGRES_MESSY_CARE_REQUIRED_MARKERS_MISSING={len(missing)}")
          if not tests or failures or errors or skipped or missing:
              raise SystemExit(
                  "PostgreSQL messy-care benchmark gate failed; "
                  f"missing evidence markers: {missing}"
              )
          PY
          test "${{ steps.postgres_benchmark.outcome }}" = "success"
          test "${{ steps.postgres_restart.outcome }}" = "success"

      - name: Upload PostgreSQL benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messy-care-postgres-junit
          path: /tmp/postgres-longitudinal.xml
          if-no-files-found: error
          retention-days: 30
