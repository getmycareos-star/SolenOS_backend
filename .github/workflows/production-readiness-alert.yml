name: Production readiness failure alert

on:
  workflow_run:
    workflows: ["Production readiness monitor"]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the production readiness incident issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = "[Production readiness] Scheduled production monitor failing";
            const body = [
              "The scheduled SolenOS production readiness monitor failed.",
              "",
              `- Run: ${run.html_url}`,
              `- Source SHA: ${run.head_sha}`,
              `- Started: ${run.run_started_at || run.created_at}`,
              `- Completed: ${run.updated_at}`,
              "",
              "This issue contains operational metadata only. Do not add caregiver data, credentials, tokens, request bodies, or medical information.",
              "",
              "Triage: inspect the failed workflow step and current production deployment; record the incident in the restricted incident register; close this issue only after a successful monitor run and documented resolution."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const issue = existing.data.find(item => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
              core.info(`Updated existing alert issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created alert issue #${created.data.number}`);
            }
