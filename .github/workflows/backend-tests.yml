name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_test
          POSTGRES_PASSWORD: solenos_ci_only
          POSTGRES_DB: solenos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_test -d solenos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend

      - name: Recreate legacy account-oriented caregivers table
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("""
                  CREATE TABLE caregivers (
                      id VARCHAR PRIMARY KEY,
                      email VARCHAR UNIQUE,
                      password_hash TEXT,
                      display_name VARCHAR,
                      care_recipient_ids JSONB,
                      role VARCHAR,
                      created_at TIMESTAMPTZ DEFAULT now()
                  )
              """)
          conn.close()
          PY

      - name: Apply full Alembic chain to PostgreSQL legacy schema
        working-directory: backend
        run: alembic upgrade head

      - name: Verify schema reconciliation and migration head
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn.cursor() as cur:
              cur.execute("""
                  SELECT column_name FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = 'caregivers'
              """)
              columns = {row[0] for row in cur.fetchall()}
              required = {"id", "email", "name", "relationship", "person_id", "timezone"}
              missing = required - columns
              if missing:
                  raise SystemExit(f"caregivers schema still missing columns: {sorted(missing)}")
              cur.execute("SELECT version_num FROM alembic_version")
              revision = cur.fetchone()[0]
              if revision != "20261024_10":
                  raise SystemExit(f"unexpected Alembic head after migration reconciliation: {revision}")
              cur.execute("SELECT COUNT(*) FROM caregivers")
              count = cur.fetchone()[0]
              if count != 0:
                  raise SystemExit(f"expected empty fixture table, got {count} rows")
          conn.close()
          print("PostgreSQL legacy-schema migration passed; no caregiver rows fabricated.")
          PY

      - name: Run real HTTP + PostgreSQL identity and persistence E2E
        env:
          SECRET_KEY: "ci-only-secret-key-long-enough-for-test-runtime"
          APP_ENV: test
        run: python backend/scripts/postgres_anonymous_e2e.py


  qwen-image-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image with the actual Qwen model
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: solenos-backend:qwen-ci
      - name: Start the built image and verify the model is present
        run: |
          docker run -d --name solenos-qwen-ci -p 8080:8080 -e DATABASE_URL=sqlite:////tmp/solenos-ci.db solenos-backend:qwen-ci
          for attempt in $(seq 1 60); do
            if docker exec solenos-qwen-ci ollama list >/tmp/ollama-list.txt 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/ollama-list.txt
          grep -q 'qwen2.5:1.5b' /tmp/ollama-list.txt
      - name: Run real Qwen inference in the built container
        run: |
          docker exec solenos-qwen-ci ollama run qwen2.5:1.5b 'Reply with exactly QWEN_RUNTIME_OK' | tee /tmp/qwen-output.txt
          grep -q 'QWEN_RUNTIME_OK' /tmp/qwen-output.txt
      - name: Verify FastAPI starts in the same container
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/openapi.json >/dev/null; then
              echo "FastAPI OpenAPI endpoint is responding."
              exit 0
            fi
            sleep 2
          done
          docker logs solenos-qwen-ci
          exit 1
