name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_test
          POSTGRES_PASSWORD: solenos_ci_only
          POSTGRES_DB: solenos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_test -d solenos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend

      - name: Recreate legacy account-oriented caregivers table
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("""
                  CREATE TABLE caregivers (
                      id VARCHAR PRIMARY KEY,
                      email VARCHAR UNIQUE,
                      password_hash TEXT,
                      display_name VARCHAR,
                      care_recipient_ids JSONB,
                      role VARCHAR,
                      created_at TIMESTAMPTZ DEFAULT now()
                  )
              """)
          conn.close()
          PY

      - name: Apply full Alembic chain to PostgreSQL legacy schema
        working-directory: backend
        run: alembic upgrade head

      - name: Verify schema reconciliation and migration head
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn.cursor() as cur:
              cur.execute("""
                  SELECT column_name FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = 'caregivers'
              """)
              columns = {row[0] for row in cur.fetchall()}
              required = {"id", "email", "name", "relationship", "person_id", "timezone"}
              missing = required - columns
              if missing:
                  raise SystemExit(f"caregivers schema still missing columns: {sorted(missing)}")
              cur.execute("SELECT version_num FROM alembic_version")
              revision = cur.fetchone()[0]
              if revision != "20261027_05_lcr_revisions":
                  raise SystemExit(f"unexpected Alembic head after migration reconciliation: {revision}")
              cur.execute("SELECT COUNT(*) FROM caregivers")
              count = cur.fetchone()[0]
              if count != 0:
                  raise SystemExit(f"expected empty fixture table, got {count} rows")
          conn.close()
          print("PostgreSQL legacy-schema migration passed; no caregiver rows fabricated.")
          PY

      - name: Run real HTTP + PostgreSQL identity and persistence E2E
        env:
          SECRET_KEY: "ci-only-secret-key-long-enough-for-test-runtime"
          APP_ENV: test
        run: python backend/scripts/postgres_anonymous_e2e.py


  qwen-image-build:
    # The full model-image/inference check is only needed for Qwen-specific PRs.
    # Database and API changes should not wait on a heavyweight model build.
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.title, 'qwen') || contains(github.event.pull_request.head.ref, 'qwen'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image with the actual Qwen model
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: solenos-backend:qwen-ci

      - name: Run real Qwen inference and authenticated API smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --detach --name solenos-qwen-e2e \
            --publish 8080:8080 \
            --env APP_ENV=ci \
            --env DATABASE_URL=sqlite:////tmp/solenos-qwen-e2e.db \
            --env SECRET_KEY=ci-only-secret \
            solenos-backend:qwen-ci
          cleanup() {
            exit_code=$?
            trap - EXIT
            if [ "$exit_code" -ne 0 ]; then
              docker logs solenos-qwen-e2e >&2 || true
              docker exec solenos-qwen-e2e bash -lc 'cat /tmp/ollama-runtime.log' >&2 || true
            fi
            docker rm --force solenos-qwen-e2e >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/ready >/tmp/solenos-ready.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs solenos-qwen-e2e
            echo "Bundled Qwen/FastAPI image did not become ready." >&2
            exit 1
          fi

          session=$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"caregiver_name":"CI-only caregiver"}' \
            http://127.0.0.1:8080/api/v1/sessions/anonymous)
          token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$session")
          person_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["person"]["id"])' <<< "$session")
          caregiver_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["caregiver"]["id"])' <<< "$session")
          auth_header="Authorization: Bearer $token"

          echo "QWEN_E2E: wait for bundled model to finish downloading and become available"
          model_ready=0
          for attempt in $(seq 1 90); do
            status_code=$(curl --silent --show-error --output /tmp/qwen-status.json --write-out '%{http_code}' --max-time 20 -H "$auth_header" \
              http://127.0.0.1:8080/api/v1/assistant/status || true)
            if [ "$status_code" = "200" ] && python - <<'PY'
          import json
          try:
              d = json.load(open("/tmp/qwen-status.json"))
              assert d.get("available") is True
              assert d.get("provider") == "local_ollama"
              assert d.get("inference_api") == "ollama_native_http"
              assert d.get("hosted_inference_api") is False
              assert d.get("model") == "qwen2.5:0.5b"
          except Exception:
              raise SystemExit(1)
          PY
            then
              model_ready=1
              break
            fi
            sleep 10
          done
          if [ "$model_ready" -ne 1 ]; then
            cat /tmp/qwen-status.json >&2 || true
            echo "Bundled Qwen model did not become available within 15 minutes." >&2
            exit 1
          fi

          echo "QWEN_E2E: Companion greeting"
          # The status endpoint may report the model inventory before the runner is
          # ready. Probe actual authenticated inference with retries instead.
          greeting=""
          greeting_ready=0
          for attempt in $(seq 1 90); do
            if greeting=$(curl --fail --silent --show-error --max-time 30 \
              -H "$auth_header" -H "Content-Type: application/json" \
              -d "{\"person_id\":\"$person_id\",\"text\":\"hi\"}" \
              http://127.0.0.1:8080/api/v1/conversation/message 2>/tmp/qwen-greeting-error); then
              if python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ai_generated") is True; assert d.get("guard_verdict") == "passed"; assert isinstance(d.get("reply"),str) and d["reply"].strip()' "$greeting" 2>/dev/null; then
                greeting_ready=1
                break
              fi
            fi
            echo "Authenticated Companion inference not ready yet (attempt $attempt/90)."
            sleep 5
          done
          if [ "$greeting_ready" -ne 1 ]; then
            cat /tmp/qwen-greeting-error >&2 || true
            echo "Bundled Qwen model did not pass real Companion inference readiness." >&2
            exit 1
          fi
          python -c 'import json,re,sys; d=json.loads(sys.argv[1]); reply=d["reply"]; assert not re.search(r"(?i)\bsaba\b", reply); assert not re.search(r"(?i)\bhow are you(?: doing)?\b", reply); assert len(re.findall(r"[^\W_]+", reply, flags=re.UNICODE)) <= 12, reply' "$greeting"

          echo "QWEN_E2E: appointment assist"
          # Retry only transient/model-rejection responses, while retaining the
          # exact HTTP status and response body so a failure is diagnosable.
          appointment_ready=0
          appointment_response=""
          for attempt in $(seq 1 5); do
            appointment_status=$(curl --silent --show-error --output /tmp/qwen-appointment-assist.json --write-out '%{http_code}' --max-time 90 \
              -H "$auth_header" -H "Content-Type: application/json" \
              -d '{"workflow":"appointment","text":"Help organize the available appointment details and unanswered questions."}' \
              http://127.0.0.1:8080/api/v1/assistant/assist || true)
            if [ "$appointment_status" = "200" ]; then
              appointment_response=$(cat /tmp/qwen-appointment-assist.json)
              if python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["ai_generated"] is True; assert d["provider_status"] == "available"; assert d["authority"] == "solenos_care_record_and_caregiver"; assert d["review_required"] is True; assert d["written_to_lcr"] is False; assert d["persistence"] == "read_only_assistance"; assert isinstance(d["reply"],str) and d["reply"].strip()' "$appointment_response" 2>/dev/null; then
                appointment_ready=1
                break
              fi
            fi
            echo "Appointment assist failed contract check (HTTP $appointment_status, attempt $attempt/5)." >&2
            cat /tmp/qwen-appointment-assist.json >&2 || true
            sleep 2
          done
          if [ "$appointment_ready" -ne 1 ]; then
            echo "Actual Qwen inference failed contract checks for workflow=appointment." >&2
            exit 1
          fi

          # Exercise every enabled read-only workflow against actual Qwen inference.
          # Retry transient 503 responses; never treat a failed inference as a pass.
          for workflow in daily_capture add_record document living_care_record care_history_search care_situation_change delta_engine evidence_provenance uncertainty_contradictions returning_caregiver appointment after_appointment handoff professional_summary open_loops two_week_review decision_outcome medication_day reminders_notifications care_coordination companion caregiver_feedback sharing_export roles_access account_recovery settings_security record_lifecycle offline_sync ai_reliability audit_review care_transition incident_follow_through emergency_readiness care_coverage_gap care_instruction_change_tracker critical_information_completeness personal_preferences_distress_context caregiver_strain_support document_validity_renewal; do
            echo "QWEN_E2E: workflow=$workflow"
            workflow_ready=0
            workflow_response=""
            for attempt in $(seq 1 5); do
              if workflow_response=$(curl --fail --silent --show-error --max-time 90 \
                -H "$auth_header" -H "Content-Type: application/json" \
                -d "{\"workflow\":\"$workflow\",\"text\":\"Help organize the available information and identify what remains unknown.\"}" \
                http://127.0.0.1:8080/api/v1/assistant/assist 2>/tmp/qwen-workflow-error); then
                if python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["workflow"] == sys.argv[2]; assert d["ai_generated"] is True; assert d["provider_status"] == "available"; assert d["review_required"] is True; assert d["written_to_lcr"] is False; assert d["persistence"] == "read_only_assistance"; assert isinstance(d["reply"],str) and d["reply"].strip(), d' "$workflow_response" "$workflow" 2>/dev/null; then
                  workflow_ready=1
                  break
                fi
              fi
              echo "Qwen workflow $workflow did not pass on attempt $attempt/5; retrying if transient."
              sleep 2
            done
            if [ "$workflow_ready" -ne 1 ]; then
              cat /tmp/qwen-workflow-error >&2 || true
              echo "Actual Qwen inference failed contract checks for workflow=$workflow" >&2
              exit 1
            fi
          done

          # Exercise durable background enqueue, automatic workflow classification, polling, and read-only behavior.
          echo "QWEN_E2E: durable background job"
          events_before=$(curl --fail --silent --show-error -H "$auth_header" "http://127.0.0.1:8080/api/v1/events/$person_id")
          queued=$(curl --fail --silent --show-error -H "$auth_header" -H "Content-Type: application/json" \
            -d '{"task_text":"Please summarize this exact note: appointment date not supplied.","context_text":"Appointment date: not supplied. No clinician notes have been provided."}' \
            http://127.0.0.1:8080/api/v1/assistant/jobs)
          job_id=$(python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["status"] == "queued"; print(d["job_id"])' "$queued")
          completed=0
          for attempt in $(seq 1 180); do
            job=$(curl --fail --silent --show-error -H "$auth_header" "http://127.0.0.1:8080/api/v1/assistant/jobs/$job_id")
            job_status=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["status"])' "$job")
            if [ "$job_status" = "completed" ]; then
              python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["workflow"] == "appointment", d; assert d["review_required"] is True; assert d["written_to_lcr"] is False; assert d["persistence"] == "read_only_assistance"; assert isinstance(d["reply"],str) and d["reply"].strip(), d' "$job"
              completed=1
              break
            fi
            if [ "$job_status" = "failed" ]; then
              echo "Background Qwen job failed: $job" >&2
              exit 1
            fi
            sleep 2
          done
          if [ "$completed" -ne 1 ]; then
            echo "Background Qwen job did not complete within six minutes: $job" >&2
            exit 1
          fi
          # A different anonymous caregiver must not read the completed job.
          other_session=$(curl --fail --silent --show-error -H "Content-Type: application/json" \
            -d '{"caregiver_name":"Second CI-only caregiver"}' http://127.0.0.1:8080/api/v1/sessions/anonymous)
          other_token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$other_session")
          other_status=$(curl --silent --show-error --output /tmp/other-job.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $other_token" "http://127.0.0.1:8080/api/v1/assistant/jobs/$job_id")
          test "$other_status" = "404"

          events_after=$(curl --fail --silent --show-error -H "$auth_header" "http://127.0.0.1:8080/api/v1/events/$person_id")
          python -c 'import json,sys; assert json.loads(sys.argv[1]) == json.loads(sys.argv[2]), "Background Qwen unexpectedly changed the Living Care Record"' "$events_before" "$events_after"

          # Community is intentionally disabled: do not call its API or run Qwen for Community.\n\n          # Upload an isolated document and confirm Qwen receives only the authorized evidence ID.
          echo "QWEN_E2E: authorized document evidence"
          printf 'CI-only document: follow-up date is not stated.\\n' > /tmp/solenos-qwen-document.txt
          upload=$(curl --fail --silent --show-error \
            -H "$auth_header" \
            -F "person_id=$person_id" \
            -F "caregiver_id=$caregiver_id" \
            -F "evidence_type=document" \
            -F "extracted_text=CI-only document: follow-up date is not stated." \
            -F "file=@/tmp/solenos-qwen-document.txt;type=text/plain" \
            http://127.0.0.1:8080/api/v1/upload)
          evidence_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["evidence_id"])' <<< "$upload")
          document_payload=$(python -c 'import json,sys; print(json.dumps({"workflow":"document","text":"Explain only what this uploaded document states and what is missing.","evidence_ids":[sys.argv[1]]}))' "$evidence_id")
          document_assist=$(curl --fail --silent --show-error \
            -H "$auth_header" -H "Content-Type: application/json" \
            -d "$document_payload" \
            http://127.0.0.1:8080/api/v1/assistant/assist)
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["ai_generated"] is True; assert d["written_to_lcr"] is False; assert sys.argv[2] in d["source_evidence_ids"]' "$document_assist" "$evidence_id"

          events=$(curl --fail --silent --show-error -H "$auth_header" \
            "http://127.0.0.1:8080/api/v1/events/$person_id")
          python -c 'import json,sys; assert json.loads(sys.argv[1]) == []' "$events"

          echo "QWEN_E2E: Daily Capture extraction"
          daily=$(curl --fail --silent --show-error \
            -H "$auth_header" -H "Content-Type: application/json" \
            -d "{\"person_id\":\"$person_id\",\"caregiver_id\":\"$caregiver_id\",\"medications\":[],\"vitals\":[],\"scales\":[],\"notes\":\"CI-only daily capture: no observation supplied.\"}" \
            http://127.0.0.1:8080/api/v1/daily/log)
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["success"] is True; assert d["qwen_extraction_status"] == "available"; assert d["qwen_written_to_lcr"] is False; assert d["qwen_review_required"] is True; candidates=d["qwen_candidates"]; assert isinstance(candidates,dict) and isinstance(candidates.get("observations"),list) and isinstance(candidates.get("open_questions"),list); assert all(x.get("review_status") == "pending_review" for x in candidates["observations"]); assert all(x.get("source_quote") and x["source_quote"] in "CI-only daily capture: no observation supplied." for x in candidates["observations"])' "$daily"
          events_after_daily=$(curl --fail --silent --show-error -H "$auth_header" \
            "http://127.0.0.1:8080/api/v1/events/$person_id")
          python -c 'import json,sys; events=json.loads(sys.argv[1]); daily=json.loads(sys.argv[2]); assert len(events) == 1; assert events[0]["id"] == daily["id"]' "$events_after_daily" "$daily"

          echo "PASS: real Qwen inference succeeded for Companion, all 38 enabled read-only care workflows, document context and Daily Capture candidate extraction; support calls wrote no LCR events."

