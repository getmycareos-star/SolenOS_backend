name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_test
          POSTGRES_PASSWORD: solenos_ci_only
          POSTGRES_DB: solenos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_test -d solenos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend

      - name: Recreate legacy account-oriented caregivers table
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("""
                  CREATE TABLE persons (
                      id VARCHAR PRIMARY KEY,
                      name VARCHAR NOT NULL,
                      date_of_birth DATE,
                      created_at TIMESTAMPTZ DEFAULT now(),
                      updated_at TIMESTAMPTZ
                  )
              """)
              cur.execute("""
                  CREATE TABLE caregivers (
                      id VARCHAR PRIMARY KEY,
                      email VARCHAR UNIQUE,
                      password_hash TEXT,
                      display_name VARCHAR,
                      care_recipient_ids JSONB,
                      role VARCHAR,
                      created_at TIMESTAMPTZ DEFAULT now()
                  )
              """)
              cur.execute("""
                  CREATE TABLE evidence (
                      id VARCHAR PRIMARY KEY,
                      person_id VARCHAR NOT NULL REFERENCES persons(id),
                      type VARCHAR NOT NULL,
                      source_text TEXT NOT NULL,
                      original_file_path VARCHAR,
                      uploaded_at TIMESTAMPTZ DEFAULT now(),
                      uploaded_by_caregiver_id VARCHAR NOT NULL REFERENCES caregivers(id),
                      extra_metadata TEXT,
                      time_provenance VARCHAR,
                      location VARCHAR,
                      confidence DOUBLE PRECISION,
                      evidence_status VARCHAR,
                      source_type VARCHAR,
                      source_span_start INTEGER,
                      source_span_end INTEGER
                  )
              """)
              cur.execute("""
                  CREATE TABLE anonymous_sessions (
                      id VARCHAR PRIMARY KEY,
                      person_id VARCHAR NOT NULL REFERENCES persons(id),
                      caregiver_id VARCHAR NOT NULL REFERENCES caregivers(id),
                      token_hash VARCHAR(64) NOT NULL UNIQUE,
                      expires_at TIMESTAMPTZ NOT NULL,
                      revoked_at TIMESTAMPTZ,
                      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
                  )
              """)
          conn.close()
          PY

      - name: Apply full Alembic chain to PostgreSQL legacy schema
        working-directory: backend
        run: alembic upgrade head

      - name: Verify schema reconciliation and migration head
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn.cursor() as cur:
              cur.execute("""
                  SELECT column_name FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = 'caregivers'
              """)
              columns = {row[0] for row in cur.fetchall()}
              required = {"id", "email", "name", "relationship", "person_id", "timezone"}
              missing = required - columns
              if missing:
                  raise SystemExit(f"caregivers schema still missing columns: {sorted(missing)}")
              cur.execute("SELECT version_num FROM alembic_version")
              revision = cur.fetchone()[0]
              if revision != "20261027_11_delta_runs_repair":
                  raise SystemExit(f"unexpected Alembic head after migration reconciliation: {revision}")
              cur.execute("SELECT COUNT(*) FROM caregivers")
              count = cur.fetchone()[0]
              if count != 0:
                  raise SystemExit(f"expected empty fixture table, got {count} rows")
          conn.close()
          print("PostgreSQL legacy-schema migration passed; no caregiver rows fabricated.")
          PY

      - name: Verify privacy, sharing, audit, notification, reminder and handoff schema
        run: |
          python - <<'PY'
          import os
          import psycopg2

          required_tables = {
              "shared_summary_expirations",
              "shared_summary_revocations",
              "shared_summary_access_logs",
              "shared_summary_downloads",
              "shared_summary_generation_jobs",
              "shared_summary_delivery_receipts",
              "shared_summary_consent_records",
              "shared_summary_disclosure_records",
              "shared_summary_link_events",
              "data_deletion_requests",
              "data_deletion_jobs",
              "data_export_requests",
              "privacy_incidents",
              "privacy_incident_events",
              "data_processing_records",
              "data_subject_requests",
              "sensitive_data_access_logs",
              "legal_holds",
              "audit_log_events",
              "audit_log_integrity_checks",
              "audit_log_access_records",
              "privileged_access_logs",
              "authorization_decisions",
              "failed_access_attempts",
              "care_notifications",
              "care_notification_preferences",
              "notification_delivery_attempts",
              "notification_delivery_receipts",
              "notification_read_receipts",
              "care_reminders",
              "reminder_acknowledgements",
              "reminder_escalations",
              "handoff_records",
              "handoff_recipients",
              "handoff_access_logs",
              "handoff_acknowledgements",
              "delivery_failure_events"
          }
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn.cursor() as cur:
              cur.execute("SELECT table_name FROM information_schema.tables WHERE table_schema='public'")
              existing = {row[0] for row in cur.fetchall()}
              missing = required_tables - existing
              if missing:
                  raise SystemExit(f"missing privacy/delivery tables: {sorted(missing)}")
              for table in sorted(required_tables):
                  cur.execute(
                      "SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name=%s",
                      (table,),
                  )
                  columns = {row[0] for row in cur.fetchall()}
                  required_columns = {"actor_id", "subject_id", "person_id", "caregiver_id", "metadata", "created_at", "updated_at"}
                  missing_columns = required_columns - columns
                  if missing_columns:
                      raise SystemExit(f"{table} missing common envelope columns: {sorted(missing_columns)}")
              cur.execute(
                  "SELECT indexdef FROM pg_indexes WHERE schemaname='public' AND tablename='notification_read_receipts' AND indexname='uq_notification_read_receipt_reader'"
              )
              receipt_index = cur.fetchone()
              if not receipt_index or "CREATE UNIQUE INDEX" not in receipt_index[0].upper():
                  raise SystemExit("notification read receipt uniqueness index is missing")
              cur.execute(
                  "SELECT data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='handoff_records' AND column_name='summary_snapshot'"
              )
              summary_column = cur.fetchone()
              if not summary_column or summary_column[0] not in {"json", "jsonb"}:
                  raise SystemExit("handoff summary_snapshot JSON column is missing or has the wrong type")
          conn.close()
          print(f"PostgreSQL verified {len(required_tables)} privacy/delivery tables and the unique read-receipt index.")
          PY

      - name: Run real HTTP + PostgreSQL identity and persistence E2E
        env:
          SECRET_KEY: "ci-only-secret-key-long-enough-for-test-runtime"
          APP_ENV: test
        run: python backend/scripts/postgres_anonymous_e2e.py


  qwen-image-build:
    # The full model-image/inference check is only needed for Qwen-specific PRs.
    # Database and API changes should not wait on a heavyweight model build.
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.title, 'qwen') || contains(github.event.pull_request.head.ref, 'qwen'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image with the actual Qwen model
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: solenos-backend:qwen-ci

      - name: Run real Qwen inference and authenticated API smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --detach --name solenos-qwen-e2e \
            --publish 8080:8080 \
            --env APP_ENV=ci \
            --env DATABASE_URL=sqlite:////tmp/solenos-qwen-e2e.db \
            --env SECRET_KEY=ci-only-secret \
            solenos-backend:qwen-ci
          cleanup() {
            exit_code=$?
            trap - EXIT
            if [ "$exit_code" -ne 0 ]; then
              docker logs solenos-qwen-e2e >&2 || true
              docker exec solenos-qwen-e2e bash -lc 'cat /tmp/ollama-runtime.log' >&2 || true
            fi
            docker rm --force solenos-qwen-e2e >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/ready >/tmp/solenos-ready.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs solenos-qwen-e2e
            echo "Bundled Qwen/FastAPI image did not become ready." >&2
            exit 1
          fi

          session=$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"caregiver_name":"CI-only caregiver"}' \
            http://127.0.0.1:8080/api/v1/sessions/anonymous)
          token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$session")
          person_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["person"]["id"])' <<< "$session")
          caregiver_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["caregiver"]["id"])' <<< "$session")
          auth_header="Authorization: Bearer $token"

          echo "QWEN_E2E: wait for bundled model to finish downloading and become available"
          model_ready=0
          for attempt in $(seq 1 90); do
            status_code=$(curl --silent --show-error --output /tmp/qwen-status.json --write-out '%{http_code}' --max-time 20 -H "$auth_header" \
              http://127.0.0.1:8080/api/v1/assistant/status || true)
            if [ "$status_code" = "200" ] && python - <<'PY'
          import json
          try:
              d = json.load(open("/tmp/qwen-status.json"))
              assert d.get("available") is True
              assert d.get("provider") == "local_ollama"
              assert d.get("inference_api") == "ollama_native_http"
              assert d.get("hosted_inference_api") is False
              assert d.get("model") == "qwen2.5:0.5b"
          except Exception:
              raise SystemExit(1)
          PY
            then
              model_ready=1
              break
            fi
            sleep 10
          done
          if [ "$model_ready" -ne 1 ]; then
            cat /tmp/qwen-status.json >&2 || true
            echo "Bundled Qwen model did not become available within 15 minutes." >&2
            exit 1
          fi

          echo "QWEN_E2E: dedicated Daily Care history retrieval and real Qwen answer"
          # Keep the dedicated Daily Care test record separate from the empty-record
          # Companion and document-isolation checks later in this job.
          daily_session=$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"caregiver_name":"CI Daily Care caregiver"}' \
            http://127.0.0.1:8080/api/v1/sessions/anonymous)
          daily_token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$daily_session")
          daily_person_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["person"]["id"])' <<< "$daily_session")
          daily_caregiver_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["caregiver"]["id"])' <<< "$daily_session")
          daily_auth_header="Authorization: Bearer $daily_token"
          daily_event_payload=$(python -c 'import json,sys; print(json.dumps({
            "person_id":sys.argv[1],
            "event_type":"observation",
            "status":"recorded",
            "occurred_at":"2026-10-27T08:00:00Z",
            "title":"CI Daily Care breakfast observation",
            "description":"Caregiver reports that breakfast intake was lower than usual today. Cause is unknown.",
            "created_by_caregiver_id":sys.argv[2],
            "time_provenance":"caregiver_reported",
            "tags":["daily_capture","ci_qwen_e2e"]
          }))' "$daily_person_id" "$daily_caregiver_id")
          daily_event=$(curl --fail --silent --show-error \
            -H "$daily_auth_header" -H "Content-Type: application/json" \
            -d "$daily_event_payload" \
            http://127.0.0.1:8080/api/v1/events)
          daily_event_id=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$daily_event")
          daily_question=$(python -c 'import json,sys; print(json.dumps({
            "question":"What was recorded about breakfast intake? Cite the source ID and date, and say what remains unknown.",
            "history_query":"breakfast",
            "prepare_lcr_proposals":False
          }))')
          daily_answer=""
          daily_ready=0
          for attempt in $(seq 1 5); do
            daily_status=$(curl --silent --show-error --output /tmp/qwen-daily-care.json --write-out '%{http_code}' --max-time 90 \
              -H "$daily_auth_header" -H "Content-Type: application/json" \
              -d "$daily_question" \
              http://127.0.0.1:8080/api/v1/daily-care/intelligence/ask || true)
            if [ "$daily_status" = "200" ]; then
              daily_answer=$(cat /tmp/qwen-daily-care.json)
              if python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["status"] == "completed", d; assert isinstance(d["answer"],str) and d["answer"].strip(), d; assert d["written_to_lcr"] is False, d; assert d["proposal_analysis_id"] is None, d; assert d["history_scope"]["records_sent_to_model"] >= 1, d; assert any(s["source_id"] == sys.argv[2] for s in d["source_records"]), d' "$daily_answer" "$daily_event_id" 2>/dev/null; then
                daily_ready=1
                break
              fi
            fi
            echo "Daily Care Qwen failed real-inference contract check (HTTP $daily_status, attempt $attempt/5)." >&2
            cat /tmp/qwen-daily-care.json >&2 || true
            sleep 2
          done
          if [ "$daily_ready" -ne 1 ]; then
            echo "Actual Qwen inference failed the dedicated Daily Care retrieval contract." >&2
            exit 1
          fi

          echo "QWEN_E2E: Companion greeting"
          # The status endpoint may report the model inventory before the runner is
          # ready. Probe actual authenticated inference with retries instead.
          greeting=""
          greeting_ready=0
          for attempt in $(seq 1 90); do
            if greeting=$(curl --fail --silent --show-error --max-time 30 \
              -H "$auth_header" -H "Content-Type: application/json" \
              -d "{\"person_id\":\"$person_id\",\"text\":\"hi\"}" \
              http://127.0.0.1:8080/api/v1/conversation/message 2>/tmp/qwen-greeting-error); then
              if python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ai_generated") is True; assert d.get("guard_verdict") == "passed"; assert isinstance(d.get("reply"),str) and d["reply"].strip()' "$greeting" 2>/dev/null; then
                greeting_ready=1
                break
              fi
            fi
            echo "Authenticated Companion inference not ready yet (attempt $attempt/90)."
            sleep 5
          done
          if [ "$greeting_ready" -ne 1 ]; then
            cat /tmp/qwen-greeting-error >&2 || true
            echo "Bundled Qwen model did not pass real Companion inference readiness." >&2
            exit 1
          fi
          python -c 'import json,re,sys; d=json.loads(sys.argv[1]); reply=d["reply"]; assert not re.search(r"(?i)\bsaba\b", reply); assert not re.search(r"(?i)\bhow are you(?: doing)?\b", reply); assert len(re.findall(r"[^\W_]+", reply, flags=re.UNICODE)) <= 12, reply' "$greeting"

          echo "QWEN_E2E: Companion answers from relevant authorized care context"
          companion_context_ready=0
          for attempt in $(seq 1 3); do
            companion_context_status=$(curl --silent --show-error --output /tmp/qwen-companion-context.json --write-out '%{http_code}' --max-time 90 \
              -H "$daily_auth_header" -H "Content-Type: application/json" \
              -d "{\"person_id\":\"$daily_person_id\",\"text\":\"What was recorded about breakfast intake, and what is still unknown?\"}" \
              http://127.0.0.1:8080/api/v1/conversation/message || true)
            if [ "$companion_context_status" = "200" ]; then
              if python -c 'import json,re,sys; d=json.load(open(sys.argv[1])); reply=d.get("reply",""); assert d.get("ai_generated") is True, d; assert d.get("guard_verdict") == "passed", d; assert d.get("written_to_lcr") is False, d; assert sys.argv[2] in d.get("source_event_ids", []), d; assert re.search(r"(?i)breakfast|intake", reply), reply; assert re.search(r"(?i)unknown|not recorded|not enough information|cannot tell|can.t tell|not possible to tell", reply), reply; assert len(reply.split()) <= 220, reply' /tmp/qwen-companion-context.json "$daily_event_id" 2>/dev/null; then
                companion_context_ready=1
                break
              fi
            fi
            echo "Companion context contract failed (HTTP $companion_context_status, attempt $attempt/3)." >&2
            cat /tmp/qwen-companion-context.json >&2 || true
            sleep 2
          done
          if [ "$companion_context_ready" -ne 1 ]; then
            echo "Actual Qwen Companion failed the grounded answer/context contract." >&2
            exit 1
          fi

          echo "QWEN_E2E: Companion resolves a follow-up reference from conversation history"
          companion_session_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["session_id"])' /tmp/qwen-companion-context.json)
          companion_followup_status=""
          for attempt in $(seq 1 3); do
            companion_followup_status=$(curl --silent --show-error --output /tmp/qwen-companion-followup.json --write-out '%{http_code}' --max-time 90 \
              -H "$daily_auth_header" -H "Content-Type: application/json" \
              -d "{\"person_id\":\"$daily_person_id\",\"session_id\":\"$companion_session_id\",\"text\":\"What was that observation about?\"}" \
              http://127.0.0.1:8080/api/v1/conversation/message || true)
            if [ "$companion_followup_status" = "200" ]; then
              break
            fi
            echo "Companion follow-up inference unavailable (HTTP $companion_followup_status, attempt $attempt/3)." >&2
            cat /tmp/qwen-companion-followup.json >&2 || true
            sleep 2
          done
          if [ "$companion_followup_status" != "200" ]; then
            echo "Actual Qwen Companion failed the follow-up conversation contract." >&2
            exit 1
          fi
          python -c 'import json,re,sys; d=json.load(open(sys.argv[1])); reply=d.get("reply",""); assert d.get("ai_generated") is True, d; assert d.get("guard_verdict") == "passed", d; assert d.get("written_to_lcr") is False, d; assert sys.argv[2] in d.get("source_event_ids", []), d; assert re.search(r"(?i)breakfast|intake", reply), reply; assert len(reply.split()) <= 220, reply' /tmp/qwen-companion-followup.json "$daily_event_id"

          echo "QWEN_E2E: appointment assist"
          # Retry only transient/model-rejection responses, while retaining the
          # exact HTTP status and response body so a failure is diagnosable.
          appointment_ready=0
          appointment_response=""
          for attempt in $(seq 1 5); do
            appointment_status=$(curl --silent --show-error --output /tmp/qwen-appointment-assist.json --write-out '%{http_code}' --max-time 90 \
              -H "$auth_header" -H "Content-Type: application/json" \
              -d '{"workflow":"appointment","text":"Help organize the available appointment details and unanswered questions."}' \
              http://127.0.0.1:8080/api/v1/assistant/assist || true)
            if [ "$appointment_status" = "200" ]; then
              appointment_response=$(cat /tmp/qwen-appointment-assist.json)
              if python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["ai_generated"] is True; assert d["provider_status"] == "available"; assert d["authority"] == "solenos_care_record_and_caregiver"; assert d["review_required"] is True; assert d["written_to_lcr"] is False; assert d["persistence"] == "read_only_assistance"; assert isinstance(d["reply"],str) and d["reply"].strip()' "$appointment_response" 2>/dev/null; then
                appointment_ready=1
                break
              fi
            fi
            echo "Appointment assist failed contract check (HTTP $appointment_status, attempt $attempt/5)." >&2
            cat /tmp/qwen-appointment-assist.json >&2 || true
            sleep 2
          done
          if [ "$appointment_ready" -ne 1 ]; then
            echo "Actual Qwen inference failed contract checks for workflow=appointment." >&2
            exit 1
          fi

          # Exercise every enabled read-only workflow against actual Qwen inference.
          # Retry transient 503 responses; never treat a failed inference as a pass.
          for workflow in daily_capture add_record document living_care_record care_history_search care_situation_change delta_engine evidence_provenance uncertainty_contradictions returning_caregiver appointment after_appointment handoff professional_summary open_loops two_week_review decision_outcome medication_day reminders_notifications care_coordination companion caregiver_feedback sharing_export roles_access account_recovery settings_security record_lifecycle offline_sync ai_reliability audit_review care_transition incident_follow_through emergency_readiness care_coverage_gap care_instruction_change_tracker critical_information_completeness personal_preferences_distress_context caregiver_strain_support document_validity_renewal; do
            echo "QWEN_E2E: workflow=$workflow"
            case "$workflow" in
              daily_capture) task_text='Organize this caregiver observation only: she slept poorly last night. Separate reported fact from unknowns.' ;;
              add_record) task_text='Draft a correction only: the old weekday was Monday and the corrected weekday is Tuesday. Do not save it.' ;;
              document) task_text='Document excerpt: The follow-up date is not stated. Explain only the excerpt and missing detail.' ;;
              living_care_record) task_text='Summarize the available care record. No care events or documents have been supplied in this session.' ;;
              care_history_search) task_text='Search the available history for a dental visit. No history is supplied; distinguish missing records from proof it did not happen.' ;;
              care_situation_change) task_text='Compare these reports only: yesterday appetite was described as normal; today caregiver reports she ate less at breakfast. Do not infer a cause.' ;;
              delta_engine) task_text='Review this candidate change only: prior note says normal appetite yesterday; new note says she ate less today. This is review-only.' ;;
              evidence_provenance) task_text='Label the source of this claim: caregiver observed she seemed tired this morning. No professional assessment is supplied.' ;;
              uncertainty_contradictions) task_text='Two notes conflict: one says Monday, another Tuesday; exact date is absent. Surface the conflict without guessing.' ;;
              returning_caregiver) task_text='I am returning to caregiving. No prior care entries are available in this session; say recent history was not supplied and ask me to provide it.' ;;
              appointment) task_text='Prepare appointment questions from this concern only: caregiver reports reduced appetite today. Do not recommend treatment.' ;;
              after_appointment) task_text='No after-appointment notes have been supplied. State that notes are missing and ask me to provide them; do not invent clinician advice.' ;;
              handoff) task_text='Draft a handoff from this report only: caregiver observed she seemed tired this morning. Recipient is unknown.' ;;
              professional_summary) task_text='Prepare a professional-facing summary from this report only: caregiver observed she seemed tired this morning. Preserve source attribution.' ;;
              open_loops) task_text='Identify the unresolved question only: we still need to confirm whether the appointment date is Monday or Tuesday.' ;;
              two_week_review) task_text='Review the last fourteen days using only this supplied fact: today caregiver reports she ate less at breakfast. No other dated events are supplied.' ;;
              decision_outcome) task_text='The family decision and its outcome are both unknown. Keep them separate and ask what information is missing.' ;;
              medication_day) task_text='Organize this caregiver report only: prescribed medication was taken with breakfast. Do not infer dose or recommend a change.' ;;
              reminders_notifications) task_text='No reminder or delivery record is supplied. State that delivery cannot be verified from this information.' ;;
              care_coordination) task_text='Organize this coordination note: one caregiver is available this afternoon; no other roles or assignments are known.' ;;
              companion) task_text='I feel overwhelmed today. Respond supportively without claiming personal experience or inventing care facts.' ;;
              caregiver_feedback) task_text='An earlier entry has the wrong date, but the correct date is not supplied. Help phrase feedback; do not claim it was saved.' ;;
              sharing_export) task_text='Prepare a shareable summary from only the supplied note; do not say it has been sent or exported.' ;;
              roles_access) task_text='No role or permission record is supplied. Explain that access status cannot be verified from this information.' ;;
              account_recovery) task_text='The user cannot sign in; no identity verification or account status is supplied. Give safe next steps without claiming the account was recovered.' ;;
              settings_security) task_text='No account security setting is supplied. State that multi-factor authentication status cannot be verified from this information.' ;;
              record_lifecycle) task_text='No lifecycle status is supplied. Explain that archive, restore, pin, or delete status cannot be verified.' ;;
              offline_sync) task_text='No sync receipt is supplied. State that synchronization status cannot be verified.' ;;
              ai_reliability) task_text='The assistant request returned an error; explain that the request failed and no model result is verified.' ;;
              audit_review) task_text='No audit entries are supplied. State that audit history is missing rather than inventing recorded actions.' ;;
              care_transition) task_text='No discharge summary or transition document is supplied. State that transition details are missing.' ;;
              incident_follow_through) task_text='No incident follow-up notes are supplied. Ask for the follow-up record and do not invent an outcome.' ;;
              emergency_readiness) task_text='No emergency plan or emergency contacts are supplied. Identify these as missing information, not as confirmed absent in the persons actual care.' ;;
              care_coverage_gap) task_text='No care schedule or coverage assignments are supplied. State that coverage gaps cannot be determined from this information.' ;;
              care_instruction_change_tracker) task_text='No previous or updated care instructions are supplied. Ask for both versions before comparing.' ;;
              critical_information_completeness) task_text='No care record or emergency information is supplied. State that completeness cannot be assessed from this information.' ;;
              personal_preferences_distress_context) task_text='No personal preferences or distress triggers are supplied. Ask what is known without inventing preferences.' ;;
              caregiver_strain_support) task_text='The caregiver says they feel overwhelmed today. Respond supportively and ask what support they have, without diagnosing burnout.' ;;
              document_validity_renewal) task_text='No document or expiration date is supplied. State that validity and renewal status cannot be determined.' ;;
            esac
            workflow_payload=$(python -c 'import json,sys; print(json.dumps({"workflow":sys.argv[1],"text":sys.argv[2]}))' "$workflow" "$task_text")
            workflow_ready=0
            workflow_response=""
            for attempt in $(seq 1 5); do
              workflow_status=$(curl --silent --show-error --output /tmp/qwen-workflow-response.json --write-out '%{http_code}' --max-time 90 \
                -H "$auth_header" -H "Content-Type: application/json" \
                -d "$workflow_payload" \
                http://127.0.0.1:8080/api/v1/assistant/assist 2>/tmp/qwen-workflow-error || true)
              workflow_response=$(cat /tmp/qwen-workflow-response.json 2>/dev/null || true)
              if [ "$workflow_status" = "200" ]; then
                if python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["workflow"] == sys.argv[2]; assert d["ai_generated"] is True; assert d["provider_status"] == "available"; assert d["review_required"] is True; assert d["written_to_lcr"] is False; assert d["persistence"] == "read_only_assistance"; assert isinstance(d["reply"],str) and d["reply"].strip(), d' "$workflow_response" "$workflow" 2>/dev/null; then
                  workflow_ready=1
                  break
                fi
              fi
              echo "Qwen workflow $workflow failed contract check (HTTP $workflow_status, attempt $attempt/5)." >&2
              cat /tmp/qwen-workflow-response.json >&2 || true
              cat /tmp/qwen-workflow-error >&2 || true
              sleep 2
            done
            if [ "$workflow_ready" -ne 1 ]; then
              echo "Actual Qwen inference failed contract checks for workflow=$workflow" >&2
              exit 1
            fi
          done

          # Exercise durable background enqueue, automatic workflow classification, polling, and read-only behavior.
          echo "QWEN_E2E: durable background job"
          events_before=$(curl --fail --silent --show-error -H "$auth_header" "http://127.0.0.1:8080/api/v1/events/$person_id")
          queued=$(curl --fail --silent --show-error -H "$auth_header" -H "Content-Type: application/json" \
            -d '{"task_text":"Please summarize this exact note: appointment date not supplied.","context_text":"Appointment date: not supplied. No clinician notes have been provided."}' \
            http://127.0.0.1:8080/api/v1/assistant/jobs)
          job_id=$(python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["status"] == "queued"; print(d["job_id"])' "$queued")
          completed=0
          for attempt in $(seq 1 180); do
            job=$(curl --fail --silent --show-error -H "$auth_header" "http://127.0.0.1:8080/api/v1/assistant/jobs/$job_id")
            job_status=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["status"])' "$job")
            if [ "$job_status" = "completed" ]; then
              python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["workflow"] == "appointment", d; assert d["review_required"] is True; assert d["written_to_lcr"] is False; assert d["persistence"] == "read_only_assistance"; assert isinstance(d["reply"],str) and d["reply"].strip(), d' "$job"
              completed=1
              break
            fi
            if [ "$job_status" = "failed" ]; then
              echo "Background Qwen job failed: $job" >&2
              exit 1
            fi
            sleep 2
          done
          if [ "$completed" -ne 1 ]; then
            echo "Background Qwen job did not complete within six minutes: $job" >&2
            exit 1
          fi
          # A different anonymous caregiver must not read the completed job.
          other_session=$(curl --fail --silent --show-error -H "Content-Type: application/json" \
            -d '{"caregiver_name":"Second CI-only caregiver"}' http://127.0.0.1:8080/api/v1/sessions/anonymous)
          other_token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$other_session")
          other_status=$(curl --silent --show-error --output /tmp/other-job.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $other_token" "http://127.0.0.1:8080/api/v1/assistant/jobs/$job_id")
          test "$other_status" = "404"

          events_after=$(curl --fail --silent --show-error -H "$auth_header" "http://127.0.0.1:8080/api/v1/events/$person_id")
          python -c 'import json,sys; assert json.loads(sys.argv[1]) == json.loads(sys.argv[2]), "Background Qwen unexpectedly changed the Living Care Record"' "$events_before" "$events_after"

          # Community is intentionally disabled: do not call its API or run Qwen for Community.\n\n          # Upload an isolated document and confirm Qwen receives only the authorized evidence ID.
          echo "QWEN_E2E: authorized document evidence"
          printf 'CI-only document: follow-up date is not stated.\\n' > /tmp/solenos-qwen-document.txt
          upload=$(curl --fail --silent --show-error \
            -H "$auth_header" \
            -F "person_id=$person_id" \
            -F "caregiver_id=$caregiver_id" \
            -F "evidence_type=document" \
            -F "extracted_text=CI-only document: follow-up date is not stated." \
            -F "file=@/tmp/solenos-qwen-document.txt;type=text/plain" \
            http://127.0.0.1:8080/api/v1/upload)
          evidence_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["evidence_id"])' <<< "$upload")
          document_payload=$(python -c 'import json,sys; print(json.dumps({"workflow":"document","text":"Explain only what this uploaded document states and what is missing.","evidence_ids":[sys.argv[1]]}))' "$evidence_id")
          document_assist=$(curl --fail --silent --show-error \
            -H "$auth_header" -H "Content-Type: application/json" \
            -d "$document_payload" \
            http://127.0.0.1:8080/api/v1/assistant/assist)
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["ai_generated"] is True; assert d["written_to_lcr"] is False; assert sys.argv[2] in d["source_evidence_ids"]' "$document_assist" "$evidence_id"

          events=$(curl --fail --silent --show-error -H "$auth_header" \
            "http://127.0.0.1:8080/api/v1/events/$person_id")
          python -c 'import json,sys; assert json.loads(sys.argv[1]) == []' "$events"

          echo "QWEN_E2E: Daily Capture extraction"
          daily=$(curl --fail --silent --show-error \
            -H "$auth_header" -H "Content-Type: application/json" \
            -d "{\"person_id\":\"$person_id\",\"caregiver_id\":\"$caregiver_id\",\"medications\":[],\"vitals\":[],\"scales\":[],\"notes\":\"CI-only daily capture: no observation supplied.\"}" \
            http://127.0.0.1:8080/api/v1/daily/log)
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["success"] is True; assert d["qwen_extraction_status"] == "available"; assert d["qwen_written_to_lcr"] is False; assert d["qwen_review_required"] is True; candidates=d["qwen_candidates"]; assert isinstance(candidates,dict) and isinstance(candidates.get("observations"),list) and isinstance(candidates.get("open_questions"),list); assert all(x.get("review_status") == "pending_review" for x in candidates["observations"]); assert all(x.get("source_quote") and x["source_quote"] in "CI-only daily capture: no observation supplied." for x in candidates["observations"])' "$daily"
          events_after_daily=$(curl --fail --silent --show-error -H "$auth_header" \
            "http://127.0.0.1:8080/api/v1/events/$person_id")
          python -c 'import json,sys; events=json.loads(sys.argv[1]); daily=json.loads(sys.argv[2]); assert len(events) == 1; assert events[0]["id"] == daily["id"]' "$events_after_daily" "$daily"

          echo "PASS: real Qwen inference succeeded for Companion, all 38 enabled read-only care workflows, document context and Daily Capture candidate extraction; support calls wrote no LCR events."

