name: Backup and recovery verification

on:
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/scripts/verify_backup_restore.py"
      - "backend/scripts/postgres_anonymous_e2e.py"
      - "backend/pyproject.toml"
      - "backend/alembic.ini"
      - "backend/docs/BACKUP_RESTORE_VERIFICATION.md"
      - ".github/workflows/backup-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solenos-backup-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_test
          POSTGRES_PASSWORD: solenos_ci_only
          POSTGRES_DB: solenos_backup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_test -d solenos_backup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_backup_test
      SECRET_KEY: "ci-only-secret-key-long-enough-for-test-runtime"
      APP_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install OCR engine and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python -m pip install --upgrade pip
          python -m pip install -e ./backend 'psycopg[binary]'

      - name: Apply current Alembic migration chain to synthetic source database
        working-directory: backend
        run: alembic upgrade head

      - name: Create disposable isolated restore database
        run: |
          python - <<'PY'
          import os
          import psycopg2

          connection = psycopg2.connect(os.environ["DATABASE_URL"])
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("CREATE DATABASE solenos_recovery_test")
          connection.close()
          PY

      - name: Use PostgreSQL 17 client matching the CI database service
        run: |
          cat > /usr/local/bin/pg_dump <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -v /tmp:/tmp postgres:17 pg_dump "$@"
          SH
          cat > /usr/local/bin/pg_restore <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -v /tmp:/tmp postgres:17 pg_restore "$@"
          SH
          chmod +x /usr/local/bin/pg_dump /usr/local/bin/pg_restore
          pg_dump --version
          pg_restore --version

      - name: Create backup, restore in isolation and verify record integrity
        env:
          SOLENOS_BACKUP_SOURCE_DATABASE_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_backup_test
          SOLENOS_BACKUP_RESTORE_DATABASE_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_recovery_test
          SOLENOS_BACKUP_RESTORE_REPORT_PATH: /tmp/solenos-backup-recovery-report.json
        run: python backend/scripts/verify_backup_restore.py

      - name: Verify exact restored caregiver through authenticated APIs
        env:
          DATABASE_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_recovery_test
        run: python backend/scripts/postgres_anonymous_e2e.py

      - name: Upload sanitized backup and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solenos-backup-recovery-${{ github.run_id }}
          path: /tmp/solenos-backup-recovery-report.json
          if-no-files-found: warn
          retention-days: 30
