name: Document intelligence PostgreSQL and OCR verification

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/api/document_lifecycle.py"
      - "backend/app/api/document_reviews.py"
      - "backend/app/services/document_extraction.py"
      - "backend/app/models/document_review.py"
      - "backend/alembic/versions/20261104_01_document_candidate_reviews.py"
      - "backend/tests/test_document_extraction_engine.py"
      - "backend/tests/test_document_reviews_postgres.py"
      - "backend/pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/document-intelligence-postgres.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_document
          POSTGRES_PASSWORD: solenos_document_ci
          POSTGRES_DB: solenos_document
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_document -d solenos_document"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://solenos_document:solenos_document_ci@localhost:5432/solenos_document
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install OCR runtime and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python -m pip install --upgrade pip
          python -m pip install -e ./backend pytest httpx psycopg2-binary
      - name: Verify OCR engine
        run: tesseract --version
      - name: Apply migrations to disposable PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Verify OCR and native extraction fixtures
        run: python -m pytest backend/tests/test_document_extraction_engine.py -q -s
      - name: Verify PostgreSQL review, LCR reconciliation and restart persistence
        run: python -m pytest backend/tests/test_document_reviews_postgres.py -q -s
