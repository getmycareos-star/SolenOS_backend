name: PostgreSQL migration validation

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/app/models/**"
      - ".github/workflows/postgres-migration-validation.yml"
  push:
    branches: [main]
    paths:
      - "backend/alembic/**"
      - "backend/app/models/**"
      - ".github/workflows/postgres-migration-validation.yml"

permissions:
  contents: read

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solenos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solenos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_test
      PSQL_URL: postgresql://postgres:postgres@localhost:5432/solenos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and PostgreSQL driver
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend psycopg2-binary

      - name: Upgrade fresh PostgreSQL database to head
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify LCR history schema columns, indexes and foreign keys
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)
          expected = {
              "living_care_records": {"person_id", "record_status", "schema_version"},
              "care_record_versions": {"care_record_id", "version_number", "snapshot_payload"},
              "care_record_snapshots": {"care_record_id", "as_of", "snapshot_payload"},
              "record_provenance": {"person_id", "source_type", "recorded_at", "metadata"},
              "record_provenance_links": {"person_id", "provenance_id", "target_type", "target_id"},
              "care_record_change_sets": {"person_id", "operation", "status"},
              "care_record_change_items": {"person_id", "change_set_id", "target_type", "target_id"},
              "care_corrections": {"person_id", "target_type", "target_id", "corrected_value", "correction_reason"},
              "record_amendments": {"person_id", "amendment_type", "reason"},
              "record_amendment_items": {"person_id", "amendment_id", "target_type", "target_id"},
              "care_record_audit_log": {"person_id", "actor_type", "action", "occurred_at"},
              "care_uncertainties": {"person_id", "question", "uncertainty_type", "status"},
              "care_missing_information": {"person_id", "topic", "description", "status"},
              "care_conflicts": {"person_id", "conflict_type", "claim_refs", "description", "status"},
              "care_action_outcomes": {"person_id", "action_id", "outcome_status"},
              "caregiver_profiles": {"person_id", "session_caregiver_id", "name", "email"},
              "caregiver_contexts": {"person_id", "reported_by_caregiver_id", "context_type", "context_payload", "epistemic_status", "recorded_at"},
              "caregiver_perspectives": {"person_id", "reported_by_caregiver_id", "topic", "perspective_text", "epistemic_status", "recorded_at"},
              "caregiver_observations": {"person_id", "reported_by_caregiver_id", "observation_category", "description", "epistemic_status", "recorded_at"},
              "care_record_identifiers": {"person_id", "care_record_id", "identifier_type", "identifier_fingerprint", "status"},
              "care_record_sections": {"person_id", "care_record_id", "section_key", "section_payload", "version_number"},
              "care_record_links": {"person_id", "source_record_id", "target_record_id", "relationship"},
              "care_record_status_history": {"person_id", "care_record_id", "new_status", "changed_at"},
              "care_fact_revisions": {"person_id", "care_fact_id", "revision_number", "current_payload", "changed_at"},
              "care_assertion_revisions": {"person_id", "assertion_id", "revision_number", "current_payload", "changed_at"},
              "care_decision_revisions": {"person_id", "decision_id", "revision_number", "current_payload", "changed_at"},
              "care_event_revisions": {"person_id", "event_id", "revision_number", "current_payload", "changed_at"},
              "care_observation_revisions": {"person_id", "observation_id", "revision_number", "current_payload", "changed_at"},
              "care_change_revisions": {"person_id", "change_id", "revision_number", "current_payload", "changed_at"},
              "care_situation_revisions": {"person_id", "situation_id", "revision_number", "current_payload", "changed_at"},
              "care_evidence_revisions": {"person_id", "evidence_id", "revision_number", "current_payload", "changed_at"},
              "care_record_retractions": {"person_id", "care_record_id", "target_type", "target_id", "reason", "status"},
              "care_record_restorations": {"person_id", "care_record_id", "retraction_id", "reason", "restored_at"},
              "appointment_workspace_records": {"person_id", "appointment_id", "status", "version_number", "payload", "updated_at"},
              "appointment_workspace_revisions": {"record_id", "person_id", "revision_number", "payload", "changed_at"},
              "contradictions": {"event_id", "context_key", "effective_from", "effective_to", "matching_candidate_ids"},
              "open_questions": {"person_id", "question", "status", "answer", "answer_provenance", "answered_at", "answered_by_caregiver_id"},
              "open_question_answer_events": {"id", "question_id", "person_id", "answer", "answer_provenance", "answered_by_caregiver_id", "created_at"},
              "contradiction_resolution_events": {"id", "contradiction_id", "person_id", "actor_caregiver_id", "previous_status", "new_status", "rationale", "resolution_scope", "evidence_ids", "created_at"},
              "evidence": {"person_id", "type", "evidence_kind", "epistemic_status", "source_text", "uploaded_by_caregiver_id", "original_author", "reported_by_label", "reported_by_caregiver_id", "collected_by_caregiver_id", "collected_at", "occurred_at", "occurred_at_timezone", "origin_channel", "original_source_reference", "parent_evidence_id", "source_text_sha256", "ingested_at"},
              "evidence_review_records": {"evidence_id", "person_id", "review_type", "outcome", "rationale", "criteria", "policy_version", "source_attribution_snapshot", "reviewed_by_caregiver_id", "created_at"},
              "evidence_claim_dependencies": {"id", "person_id", "claim_id", "depends_on_claim_id", "dependency_type", "rationale", "created_by_caregiver_id", "created_at"},
              "evidence_claim_assessments": {"id", "person_id", "claim_id", "claim_version", "status", "rationale", "policy_version", "evidence_links", "reviewed_by_caregiver_id", "supersedes_assessment_id", "created_at"},
              "evidence_source_relationships": {"id", "person_id", "source_evidence_id", "related_evidence_id", "relationship_type", "source_independence_status", "origin_group_key", "rationale", "reviewed_by_caregiver_id", "created_at"},
              "evidence_observations": {"id", "person_id", "evidence_id", "supersedes_observation_id", "correction_rationale", "observation_kind", "epistemic_status", "subject_label", "attribute", "value_text", "source_passage", "source_span_start", "source_span_end", "negated", "hedge_marker", "ambiguity_note", "extraction_method", "extraction_version", "created_by_caregiver_id", "recorded_at"},
          }
          for table, required in expected.items():
              assert inspector.has_table(table), f"missing table: {table}"
              actual = {column["name"] for column in inspector.get_columns(table)}
              missing = required - actual
              assert not missing, f"{table} missing columns: {sorted(missing)}"
              print(f"PASS {table}: {len(required)} required columns")

          fks = {
              "living_care_records": "person_id",
              "care_record_versions": "care_record_id",
              "care_record_snapshots": "care_record_id",
              "record_provenance": "person_id",
              "care_record_change_sets": "person_id",
              "care_record_change_items": "change_set_id",
              "care_corrections": "person_id",
              "record_amendments": "person_id",
              "care_record_audit_log": "person_id",
              "care_uncertainties": "person_id",
              "care_missing_information": "person_id",
              "care_conflicts": "person_id",
              "care_record_identifiers": "care_record_id",
              "care_record_sections": "care_record_id",
              "care_record_links": "source_record_id",
              "care_record_status_history": "care_record_id",
              "care_fact_revisions": "care_fact_id",
              "care_assertion_revisions": "assertion_id",
              "care_decision_revisions": "decision_id",
              "care_event_revisions": "event_id",
              "care_observation_revisions": "observation_id",
              "care_change_revisions": "change_id",
              "care_situation_revisions": "situation_id",
              "care_evidence_revisions": "evidence_id",
              "care_record_retractions": "care_record_id",
              "care_record_restorations": "retraction_id",
              "appointment_workspace_records": "person_id",
              "appointment_workspace_revisions": "record_id",
              "caregiver_profiles": "session_caregiver_id",
              "evidence_claim_assessments": "claim_id",
          }
          for table, column in fks.items():
              foreign_keys = inspector.get_foreign_keys(table)
              assert any(column in fk.get("constrained_columns", []) for fk in foreign_keys), f"{table}.{column} missing foreign key"
              print(f"PASS FK {table}.{column}")
          unique = inspector.get_unique_constraints("care_record_versions")
          indexes = inspector.get_indexes("care_record_versions")
          has_version_uniqueness = (
              any(set(item.get("column_names") or []) == {"care_record_id", "version_number"} for item in unique)
              or any(item.get("unique") and set(item.get("column_names") or []) == {"care_record_id", "version_number"} for item in indexes)
          )
          assert has_version_uniqueness, "care record version uniqueness missing"
          print("PASS unique version per care record")
          profile_columns = {column["name"]: column for column in inspector.get_columns("caregiver_profiles")}
          assert profile_columns["email"]["nullable"] is True, "caregiver_profiles.email must allow anonymous profiles"
          profile_unique = inspector.get_unique_constraints("caregiver_profiles")
          profile_indexes = inspector.get_indexes("caregiver_profiles")
          has_profile_link_uniqueness = (
              any(set(item.get("column_names") or []) == {"session_caregiver_id"} for item in profile_unique)
              or any(item.get("unique") and set(item.get("column_names") or []) == {"session_caregiver_id"} for item in profile_indexes)
          )
          assert has_profile_link_uniqueness, "caregiver profile session link must be unique"
          print("PASS unique caregiver profile session link and nullable email")
          assert inspector.has_table("evidence_review_records"), "evidence review history table missing"
          print("PASS persisted evidence review history table")
          if engine.dialect.name == "postgresql":
              with engine.connect() as connection:
                  trigger = connection.exec_driver_sql("""
                      SELECT 1 FROM pg_trigger
                      WHERE tgname = 'trg_evidence_review_records_immutable'
                        AND NOT tgisinternal
                  """).first()
                  assert trigger is not None, "evidence review immutability trigger missing"
                  claim_trigger = connection.exec_driver_sql("""
                      SELECT 1 FROM pg_trigger
                      WHERE tgname = 'trg_evidence_claim_assessments_immutable'
                        AND NOT tgisinternal
                  """).first()
                  assert claim_trigger is not None, "claim assessment immutability trigger missing"
                  dependency_trigger = connection.exec_driver_sql("""
                      SELECT 1 FROM pg_trigger
                      WHERE tgname = 'trg_evidence_claim_dependencies_immutable'
                        AND NOT tgisinternal
                  """).first()
                  assert dependency_trigger is not None, "claim dependency append-only trigger missing"
                  resolution_scope_columns = {
                      row[0] for row in connection.exec_driver_sql("""
                          SELECT column_name FROM information_schema.columns
                          WHERE table_schema = 'public'
                            AND table_name = 'contradiction_resolution_events'
                      """).all()
                  }
                  assert "resolution_scope" in resolution_scope_columns, "partial conflict resolution scope column missing"
                  answer_history_trigger = connection.exec_driver_sql("""
                      SELECT 1 FROM pg_trigger
                      WHERE tgname = 'trg_open_question_answer_events_immutable'
                        AND NOT tgisinternal
                  """).first()
                  assert answer_history_trigger is not None, "clarification answer history append-only trigger missing"
              print("PASS evidence review append-only trigger")
              print("PASS claim assessment append-only trigger")
              print("PASS claim dependency append-only trigger")
              print("PASS persisted conflict resolution scope column")
              print("PASS clarification answer history append-only trigger")
          pattern_indexes = inspector.get_indexes("patterns")
          active_pattern_index = next(
              (item for item in pattern_indexes if item.get("name") == "uq_patterns_one_active_per_subject"),
              None,
          )
          assert active_pattern_index and active_pattern_index.get("unique"), "active pattern uniqueness index missing"
          assert active_pattern_index.get("dialect_options", {}).get("postgresql_where") or active_pattern_index.get("dialect_options", {}).get("sqlite_where"), "active pattern uniqueness index must be partial"
          print("PASS unique active longitudinal pattern per subject")


          for table, columns in (
              ("care_record_sections", {"care_record_id", "section_key"}),
              ("care_fact_revisions", {"care_fact_id", "revision_number"}),
              ("care_assertion_revisions", {"assertion_id", "revision_number"}),
              ("care_decision_revisions", {"decision_id", "revision_number"}),
              ("care_event_revisions", {"event_id", "revision_number"}),
              ("care_observation_revisions", {"observation_id", "revision_number"}),
              ("care_change_revisions", {"change_id", "revision_number"}),
              ("care_situation_revisions", {"situation_id", "revision_number"}),
              ("care_evidence_revisions", {"evidence_id", "revision_number"}),
              ("appointment_workspace_revisions", {"record_id", "revision_number"}),
          ):
              constraints = inspector.get_unique_constraints(table)
              indexes = inspector.get_indexes(table)
              has_unique = (
                  any(set(item.get("column_names") or []) == columns for item in constraints)
                  or any(item.get("unique") and set(item.get("column_names") or []) == columns for item in indexes)
              )
              assert has_unique, f"{table} missing unique target revision constraint"
              print(f"PASS unique revision {table}")
          engine.dispose()
          PY

      - name: Verify migration graph has exactly one head
        working-directory: backend
        run: |
          python -m alembic heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
          python -m alembic current

      - name: Verify LCR query indexes on the fully migrated PostgreSQL schema
        run: |
            for index in ix_care_events_person_occurred_recorded_id ix_evidence_person_uploaded_id ix_care_facts_person_recorded_id ix_care_assertions_person_recorded_id ix_appointments_person_scheduled_id ix_care_timeline_person_occurred_id ix_decision_outcomes_person_observed_id ix_care_uncertainties_person_created_id ix_care_missing_info_person_created_id ix_care_conflicts_person_created_id ix_caregiver_observations_person_observed_id; do
              found="$(psql "$PSQL_URL" -Atc "SELECT to_regclass('public.$index')")"
              test "$found" = "$index"
            done

      - name: Verify immutable evidence source trigger rejects direct SQL mutation
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.exc import DBAPIError
          from app.models.care import Caregiver, Evidence, Person
          from app.core.database import Base

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              trigger_count = connection.execute(text("""
                  SELECT count(*) FROM pg_trigger
                  WHERE tgname = 'trg_evidence_source_immutable' AND NOT tgisinternal
              """)).scalar_one()
              assert trigger_count == 1, "immutable evidence source trigger is missing"
              lineage_trigger_count = connection.execute(text("""
                  SELECT count(*) FROM pg_trigger
                  WHERE tgname = 'trg_evidence_source_relationships_immutable' AND NOT tgisinternal
              """)).scalar_one()
              assert lineage_trigger_count == 1, "append-only source-lineage trigger is missing"
              observation_trigger_count = connection.execute(text("""
                  SELECT count(*) FROM pg_trigger
                  WHERE tgname = 'trg_evidence_observations_immutable' AND NOT tgisinternal
              """)).scalar_one()
              assert observation_trigger_count == 1, "append-only evidence-observation trigger is missing"

          # Exercise the database guard independently of SQLAlchemy's ORM listener.
          with engine.begin() as connection:
              person_id = "evidence-immutable-trigger-person"
              caregiver_id = "evidence-immutable-trigger-caregiver"
              evidence_id = "evidence-immutable-trigger-record"
              connection.execute(text("INSERT INTO persons (id, name) VALUES (:id, 'Evidence trigger test')"), {"id": person_id})
              connection.execute(text("""
                  INSERT INTO caregivers (id, name, relationship, person_id, timezone)
                  VALUES (:id, 'Evidence trigger caregiver', 'family', :person_id, 'UTC')
              """), {"id": caregiver_id, "person_id": person_id})
              connection.execute(text("""
                  INSERT INTO evidence (id, person_id, type, source_text, uploaded_by_caregiver_id, source_text_sha256)
                  VALUES (:id, :person_id, 'caregiver_report', 'original source', :caregiver_id,
                          'd9b1f3e2b0e1a5a8c2c3d4e5f60718293a4b5c6d7e8f901234567890abcdef12')
              """), {"id": evidence_id, "person_id": person_id, "caregiver_id": caregiver_id})
          with engine.connect() as connection:
              transaction = connection.begin()
              try:
                  connection.execute(text("""
                      UPDATE evidence SET source_text = 'tampered source'
                      WHERE id = 'evidence-immutable-trigger-record'
                  """))
              except DBAPIError as exc:
                  transaction.rollback()
                  assert "immutable" in str(exc).lower(), f"unexpected database error: {exc}"
                  print("PASS direct SQL source-text mutation rejected by PostgreSQL trigger")
              else:
                  transaction.rollback()
                  raise AssertionError("direct SQL mutation unexpectedly changed original evidence")
              finally:
                  if transaction.is_active:
                      transaction.rollback()
          with engine.begin() as connection:
              connection.execute(text("DELETE FROM evidence WHERE id = 'evidence-immutable-trigger-record'"))
              connection.execute(text("DELETE FROM caregivers WHERE id = 'evidence-immutable-trigger-caregiver'"))
              connection.execute(text("DELETE FROM persons WHERE id = 'evidence-immutable-trigger-person'"))
          engine.dispose()
          PY

      - name: Verify clarification answer history trigger rejects direct SQL mutation
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.exc import DBAPIError
          from sqlalchemy.orm import Session
          from app.models.care import Caregiver, Person
          from app.models.uncertainty import OpenQuestion, OpenQuestionAnswerEvent
          from app.core.uncertainty_enums import Priority

          engine = create_engine(os.environ["DATABASE_URL"])
          with Session(engine) as db:
              person = Person(id="question-answer-trigger-person", name="Question answer trigger test")
              # Explicitly persist the parent before its foreign-key-dependent caregiver.
              db.add(person)
              db.flush()
              caregiver = Caregiver(
                  id="question-answer-trigger-caregiver",
                  name="Question answer trigger caregiver",
                  email="question-answer-trigger@example.invalid",
                  relationship="Family",
                  person_id=person.id,
                  timezone="UTC",
              )
              db.add_all([person, caregiver])
              db.flush()
              question = OpenQuestion(
                  id="question-answer-trigger-question",
                  person_id=person.id,
                  question="Was the appointment attended?",
                  subject_type="appointment",
                  subject_id="appointment-trigger-test",
                  priority=Priority.INFORMATIONAL,
                  status="answered",
                  answer="Caregiver reports attendance.",
                  answer_provenance="Caregiver report recorded during the test.",
                  answered_by_caregiver_id=caregiver.id,
              )
              db.add(question)
              db.flush()
              event = OpenQuestionAnswerEvent(
                  id="question-answer-trigger-event",
                  question_id=question.id,
                  person_id=person.id,
                  answer="Caregiver reports attendance.",
                  answer_provenance="Caregiver report recorded during the test.",
                  answered_by_caregiver_id=caregiver.id,
              )
              db.add(event)
              db.commit()

          with engine.connect() as connection:
              transaction = connection.begin()
              try:
                  connection.execute(text("""
                      UPDATE open_question_answer_events
                      SET answer = 'tampered answer'
                      WHERE id = 'question-answer-trigger-event'
                  """))
              except DBAPIError as exc:
                  transaction.rollback()
                  assert "append-only" in str(exc).lower(), f"unexpected database error: {exc}"
                  print("PASS direct SQL answer-history mutation rejected by PostgreSQL trigger")
              else:
                  transaction.rollback()
                  raise AssertionError("direct SQL mutation unexpectedly changed immutable answer history")
              finally:
                  if transaction.is_active:
                      transaction.rollback()
          engine.dispose()
          PY

      - name: Exercise anonymous care continuity against PostgreSQL over HTTP
        working-directory: backend
        run: python scripts/postgres_anonymous_e2e.py

      - name: Create isolated PostgreSQL migration test databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres solenos_legacy_empty
          createdb -h localhost -U postgres solenos_legacy_populated
          createdb -h localhost -U postgres solenos_stamped_04
          createdb -h localhost -U postgres solenos_qwen_backfill

      - name: Upgrade a production-like database already stamped at revision 20261024_04
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_stamped_04
          PSQL_URL: postgresql://postgres:postgres@localhost:5432/solenos_stamped_04
        working-directory: backend
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE persons (id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL);
            CREATE TABLE caregivers (id VARCHAR PRIMARY KEY, password_hash TEXT, display_name VARCHAR);
            CREATE TABLE care_events (id VARCHAR PRIMARY KEY, person_id VARCHAR NOT NULL REFERENCES persons(id));
            CREATE TABLE evidence (id VARCHAR PRIMARY KEY, person_id VARCHAR NOT NULL REFERENCES persons(id));
            CREATE TABLE anonymous_sessions (id VARCHAR PRIMARY KEY, person_id VARCHAR NOT NULL REFERENCES persons(id), caregiver_id VARCHAR NOT NULL REFERENCES caregivers(id), token_hash VARCHAR(64) NOT NULL UNIQUE, expires_at TIMESTAMPTZ NOT NULL, revoked_at TIMESTAMPTZ NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT now());
            CREATE TABLE contradictions (id VARCHAR PRIMARY KEY);
            CREATE TABLE alembic_version (version_num VARCHAR(32) NOT NULL);
            INSERT INTO alembic_version (version_num) VALUES ('20261024_04');
          "
          python -m alembic upgrade head
          test "$(psql "$PSQL_URL" -Atc "SELECT version_num FROM alembic_version")" = "20261029_14_q_answer_hist"
          for table in care_facts care_fact_evidence care_record_relationships care_delta_items care_integrity_findings care_integrity_resolutions care_decisions decision_outcomes care_reconciliation_records care_follow_up_links care_review_decisions care_provenance_records care_timeline_entries care_change_assessments care_state_revisions care_assertions care_action_outcomes share_intakes qwen_background_jobs improvement_training_examples caregiver_profiles caregiver_roles caregiver_responsibilities caregiver_person_relationships caregiver_account_links caregiver_devices device_trust_records account_recovery_requests login_attempt_limits identity_audit_events qwen_model_outputs qwen_job_events qwen_safety_evaluations assessment_dimensions ai_output_rejections ai_safety_checks ai_safety_violations ai_model_versions ai_prompt_versions ai_inference_metrics ai_job_status_events ai_human_feedback ai_output_lcr_proposals ai_output_lcr_decisions care_record_identifiers care_record_sections care_record_links care_record_status_history care_fact_revisions care_assertion_revisions care_decision_revisions care_event_revisions care_observation_revisions care_change_revisions care_situation_revisions care_evidence_revisions care_record_retractions care_record_restorations appointment_workspace_records appointment_workspace_revisions shared_summary_expirations shared_summary_revocations shared_summary_access_logs shared_summary_downloads shared_summary_generation_jobs shared_summary_delivery_receipts shared_summary_consent_records shared_summary_disclosure_records shared_summary_link_events data_deletion_requests data_deletion_jobs data_export_requests privacy_incidents privacy_incident_events data_processing_records data_subject_requests sensitive_data_access_logs legal_holds audit_log_events audit_log_integrity_checks audit_log_access_records privileged_access_logs authorization_decisions failed_access_attempts evidence_source_relationships evidence_observations care_notifications care_notification_preferences notification_delivery_attempts notification_delivery_receipts notification_read_receipts care_reminders reminder_acknowledgements reminder_escalations handoff_records handoff_recipients handoff_access_logs handoff_acknowledgements delivery_failure_events change_confirmation_events contradiction_resolution_events evidence_review_records evidence_claim_dependencies open_question_answer_events; do
