name: PostgreSQL migration validation

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/app/models/**"
      - ".github/workflows/postgres-migration-validation.yml"
  push:
    branches: [main]
    paths:
      - "backend/alembic/**"
      - "backend/app/models/**"
      - ".github/workflows/postgres-migration-validation.yml"

permissions:
  contents: read

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solenos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solenos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and PostgreSQL driver
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend psycopg2-binary
      - name: Upgrade fresh PostgreSQL database to head
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Verify a single current migration head
        working-directory: backend
        run: python -m alembic current
