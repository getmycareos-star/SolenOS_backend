name: PostgreSQL migration validation

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/app/models/**"
      - ".github/workflows/postgres-migration-validation.yml"
  push:
    branches: [main]
    paths:
      - "backend/alembic/**"
      - "backend/app/models/**"
      - ".github/workflows/postgres-migration-validation.yml"

permissions:
  contents: read

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solenos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solenos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_test
      PSQL_URL: postgresql://postgres:postgres@localhost:5432/solenos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and PostgreSQL driver
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend psycopg2-binary

      - name: Upgrade fresh PostgreSQL database to head
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify migration graph has exactly one head
        working-directory: backend
        run: |
          python -m alembic heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
          python -m alembic current

      - name: Exercise anonymous care continuity against PostgreSQL over HTTP
        working-directory: backend
        run: python scripts/postgres_anonymous_e2e.py

      - name: Create isolated PostgreSQL migration test databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres solenos_legacy_empty
          createdb -h localhost -U postgres solenos_legacy_populated
          createdb -h localhost -U postgres solenos_stamped_04

      - name: Upgrade a production-like database already stamped at revision 20261024_04
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_stamped_04
          PSQL_URL: postgresql://postgres:postgres@localhost:5432/solenos_stamped_04
        working-directory: backend
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE persons (id VARCHAR PRIMARY KEY, name VARCHAR NOT NULL);
            CREATE TABLE caregivers (id VARCHAR PRIMARY KEY, password_hash TEXT, display_name VARCHAR);
            CREATE TABLE care_events (id VARCHAR PRIMARY KEY, person_id VARCHAR NOT NULL REFERENCES persons(id));
            CREATE TABLE contradictions (id VARCHAR PRIMARY KEY);
            CREATE TABLE alembic_version (version_num VARCHAR(32) NOT NULL);
            INSERT INTO alembic_version (version_num) VALUES ('20261024_04');
          "
          python -m alembic upgrade head
          test "$(psql "$PSQL_URL" -Atc "SELECT version_num FROM alembic_version")" = "20261025_05"
          for table in care_state_revisions care_assertions care_action_outcomes share_intakes account_security_tokens account_mfa_secrets account_mfa_recovery_codes account_login_attempts account_security_requests; do
            found="$(psql "$PSQL_URL" -Atc "SELECT to_regclass('public.$table')")"
            test "$found" = "$table"
          done

      - name: Test empty legacy caregivers table is reconciled on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_legacy_empty
          PSQL_URL: postgresql://postgres:postgres@localhost:5432/solenos_legacy_empty
        working-directory: backend
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE caregivers (
              id VARCHAR PRIMARY KEY,
              email VARCHAR,
              password_hash VARCHAR,
              display_name VARCHAR,
              care_recipient_ids JSONB,
              role VARCHAR,
              created_at TIMESTAMPTZ DEFAULT now()
            );
          "
          python -m alembic upgrade head
          for column in name relationship person_id timezone; do
            found="$(psql "$PSQL_URL" -Atc "SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='caregivers' AND column_name='$column'")"
            test "$found" = "$column"
          done
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conrelid = 'caregivers'::regclass
                  AND contype = 'f'
                  AND conname LIKE '%person_id%'
              ) THEN
                RAISE EXCEPTION 'caregivers.person_id foreign key missing';
              END IF;
            END
            \$\$;
          "

      - name: Test populated legacy caregivers table fails closed without data loss
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_legacy_populated
          PSQL_URL: postgresql://postgres:postgres@localhost:5432/solenos_legacy_populated
        working-directory: backend
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE caregivers (
              id VARCHAR PRIMARY KEY,
              email VARCHAR,
              password_hash VARCHAR,
              display_name VARCHAR,
              care_recipient_ids JSONB,
              role VARCHAR,
              created_at TIMESTAMPTZ DEFAULT now()
            );
            INSERT INTO caregivers (id, email, display_name, role)
            VALUES ('legacy-caregiver-1', 'legacy@example.invalid', 'Legacy account', 'caregiver');
          "
          if python -m alembic upgrade head > /tmp/legacy-upgrade.log 2>&1; then
            cat /tmp/legacy-upgrade.log
            echo "Expected populated legacy schema migration to fail closed."
            exit 1
          fi
          grep -q "requires a reviewed identity mapping" /tmp/legacy-upgrade.log
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM caregivers WHERE id='legacy-caregiver-1'")" = "1"
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='caregivers' AND column_name='name'")" = "0"
          # Alembic may roll back its version table together with the failed upgrade transaction.
          version_table_exists="$(psql "$PSQL_URL" -Atc "SELECT to_regclass('public.alembic_version') IS NOT NULL")"
          if [ "$version_table_exists" = "t" ]; then
            version="$(psql "$PSQL_URL" -Atc "SELECT version_num FROM alembic_version")"
            test "$version" = "20261022_02"
          else
            echo "Alembic version table rolled back with failed upgrade transaction; legacy data and schema checks passed."
          fi
