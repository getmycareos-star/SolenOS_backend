      - name: Preserve completed Qwen outputs and source IDs during schema migration
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_qwen_backfill
          PSQL_URL: postgresql://postgres:postgres@localhost:5432/solenos_qwen_backfill
        working-directory: backend
        run: |
          # Upgrade to the pre-governance canonical head, then seed a completed legacy job.
          python -m alembic upgrade 20261027_04_caregiver_context
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO persons (id, name) VALUES ('p-qwen-backfill', 'Backfill test person');
            INSERT INTO caregivers (id, name, email, relationship, person_id, timezone)
              VALUES ('c-qwen-backfill', 'Backfill caregiver', 'qwen-backfill@example.invalid', 'family', 'p-qwen-backfill', 'UTC');
            INSERT INTO qwen_background_jobs
              (id, person_id, caregiver_id, status, task_text, context_text, evidence_ids_json, workflow, result_text, source_event_ids_json, source_evidence_ids_json, attempt_count)
              VALUES
              ('job-qwen-backfill', 'p-qwen-backfill', 'c-qwen-backfill', 'completed', 'Summarize the appointment note', '', '[]', 'appointment', 'Preserve this exact completed suggestion.', '[\"event-source-1\"]', '[\"evidence-source-1\"]', 1);
          "
          python -m alembic upgrade head
          test "$(psql "$PSQL_URL" -Atc "SELECT version_num FROM alembic_version")" = "20261029_14_q_answer_hist"
          test "$(psql "$PSQL_URL" -Atc "SELECT result_text IS NULL FROM qwen_background_jobs WHERE id='job-qwen-backfill'")" = "t"
          test "$(psql "$PSQL_URL" -Atc "SELECT output_text FROM qwen_model_outputs WHERE job_id='job-qwen-backfill'")" = "Preserve this exact completed suggestion."
          test "$(psql "$PSQL_URL" -Atc "SELECT source_event_ids_json FROM qwen_model_outputs WHERE job_id='job-qwen-backfill'")" = '["event-source-1"]'
          test "$(psql "$PSQL_URL" -Atc "SELECT source_evidence_ids_json FROM qwen_model_outputs WHERE job_id='job-qwen-backfill'")" = '["evidence-source-1"]'
          test "$(psql "$PSQL_URL" -Atc "SELECT written_to_lcr FROM qwen_model_outputs WHERE job_id='job-qwen-backfill'")" = "f"
          test "$(psql "$PSQL_URL" -Atc "SELECT review_status FROM qwen_model_outputs WHERE job_id='job-qwen-backfill'")" = "pending_review"
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM qwen_safety_evaluations WHERE job_id='job-qwen-backfill' AND human_review_required")" = "1"
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM qwen_job_events WHERE job_id='job-qwen-backfill' AND event_type='legacy_output_backfilled'")" = "1"

      - name: Test empty legacy caregivers table is reconciled on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_legacy_empty
          PSQL_URL: postgresql://postgres:postgres@localhost:5432/solenos_legacy_empty
        working-directory: backend
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE caregivers (
              id VARCHAR PRIMARY KEY,
              email VARCHAR,
              password_hash VARCHAR,
              display_name VARCHAR,
              care_recipient_ids JSONB,
              role VARCHAR,
              created_at TIMESTAMPTZ DEFAULT now()
            );
          "
          python -m alembic upgrade head
          for column in name relationship person_id timezone; do
            found="$(psql "$PSQL_URL" -Atc "SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='caregivers' AND column_name='$column'")"
            test "$found" = "$column"
          done
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conrelid = 'caregivers'::regclass
                  AND contype = 'f'
                  AND conname LIKE '%person_id%'
              ) THEN
                RAISE EXCEPTION 'caregivers.person_id foreign key missing';
              END IF;
            END
            \$\$;
          "

      - name: Test populated legacy caregivers table fails closed without data loss
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/solenos_legacy_populated
          PSQL_URL: postgresql://postgres:postgres@localhost:5432/solenos_legacy_populated
        working-directory: backend
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE caregivers (
              id VARCHAR PRIMARY KEY,
              email VARCHAR,
              password_hash VARCHAR,
              display_name VARCHAR,
              care_recipient_ids JSONB,
              role VARCHAR,
              created_at TIMESTAMPTZ DEFAULT now()
            );
            INSERT INTO caregivers (id, email, display_name, role)
            VALUES ('legacy-caregiver-1', 'legacy@example.invalid', 'Legacy account', 'caregiver');
          "
          if python -m alembic upgrade head > /tmp/legacy-upgrade.log 2>&1; then
            cat /tmp/legacy-upgrade.log
            echo "Expected populated legacy schema migration to fail closed."
            exit 1
          fi
          grep -q "requires a reviewed identity mapping" /tmp/legacy-upgrade.log
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM caregivers WHERE id='legacy-caregiver-1'")" = "1"
          test "$(psql "$PSQL_URL" -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='caregivers' AND column_name='name'")" = "0"
          # Alembic may roll back its version table together with the failed upgrade transaction.
          version_table_exists="$(psql "$PSQL_URL" -Atc "SELECT to_regclass('public.alembic_version') IS NOT NULL")"
          if [ "$version_table_exists" = "t" ]; then
            version="$(psql "$PSQL_URL" -Atc "SELECT version_num FROM alembic_version")"
            test "$version" = "20261022_02"
          else
            echo "Alembic version table rolled back with failed upgrade transaction; legacy data and schema checks passed."
          fi
