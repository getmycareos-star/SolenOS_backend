name: Prune duplicate queued backend checks

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  prune-queued-checks:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Keep only the newest queued run for each backend check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const names = new Set([
              "Backend validation",
              "Document lifecycle PostgreSQL integration",
              "Backend tests",
              "PostgreSQL migration validation",
              "Companion live Qwen inference evaluation"
            ]);
            const queued = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, status: "queued", per_page: 100 }
            );
            const groups = new Map();
            const cancelAll = [];
            for (const run of queued) {
              if (run.head_branch !== "main" || run.id === currentRunId) continue;
              if (run.name === "Cancel redundant benchmark runs") {
                cancelAll.push(run);
                continue;
              }
              if (!names.has(run.name)) continue;
              const group = groups.get(run.name) ?? [];
              group.push(run);
              groups.set(run.name, group);
            }
            const targets = [...cancelAll];
            for (const [name, group] of groups) {
              group.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              targets.push(...group.slice(1));
              core.info(`${name}: keeping newest queued run ${group[0]?.id}; pruning ${Math.max(0, group.length - 1)} older run(s).`);
            }
            core.info(`Cancelling ${targets.length} stale queued backend check run(s).`);
            for (const run of targets) {
              core.info(`Cancelling ${run.id}: ${run.name} at ${run.head_sha}.`);
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
            }
            core.info("Queue pruning requests submitted.");
