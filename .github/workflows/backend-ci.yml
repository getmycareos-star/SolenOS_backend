name: SolenOS backend verification

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: solenos-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "true"
      DATABASE_URL: "sqlite:///./solenos-ci.db"
      PYTHONPATH: "backend:."
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e "backend/.[test]"

      - name: Compile application and tests
        run: python -m compileall -q backend/app backend/tests

      - name: Run automated tests
        run: python -m pytest -q --timeout=120 backend/tests

      - name: Build production container
        run: docker build --file backend/Dockerfile --tag solenos-backend-ci backend
