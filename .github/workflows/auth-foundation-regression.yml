name: Authentication foundation regression

on:
  pull_request:
    paths:
      - "backend/app/models/auth_identity.py"
      - "backend/app/services/auth_service.py"
      - "backend/app/api/authentication.py"
      - "backend/app/core/authz.py"
      - "backend/app/api/uncertainty.py"
      - "backend/app/api/change.py"
      - "backend/app/api/causal.py"
      - "backend/app/api/v1.py"
      - "backend/app/api/caregiver_intelligence.py"
      - "backend/app/api/safety.py"
      - "backend/app/api/actions.py"
      - "backend/app/main.py"
      - "backend/app/models/auth_identity.py"
      - "backend/app/core/database.py"
      - "backend/app/main.py"
      - "backend/pyproject.toml"
      - "backend/tests/test_auth_service_primitives.py"
      - "backend/tests/test_auth_service_sessions.py"
      - "backend/tests/test_auth_api.py"
      - ".github/workflows/auth-foundation-regression.yml"
  push:
    branches:
      - security/auth-foundation-step1

permissions:
  contents: read

jobs:
  auth-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest httpx2
      - name: Run password-hashing primitive regressions
        run: python -m pytest -q tests/test_auth_service_primitives.py
      - name: Run account and session lifecycle regressions
        run: python -m pytest -q tests/test_auth_service_sessions.py
      - name: Run HTTP authentication lifecycle regression
        run: python -m pytest -q tests/test_auth_api.py
      - name: Verify application imports and routes register
        run: python -c "from app.main import app; assert '/api/v1/auth/me' in app.openapi()['paths']"
      - name: Compile changed Python modules
        run: |
          python -m py_compile app/models/auth_identity.py app/services/auth_service.py app/api/authentication.py app/core/authz.py app/api/uncertainty.py app/api/change.py app/api/causal.py app/api/v1.py app/api/caregiver_intelligence.py app/api/safety.py app/api/actions.py app/main.py app/core/database.py app/main.py
