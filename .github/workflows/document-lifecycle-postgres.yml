# Document ingestion resume regression coverage runs against the current main implementation.
name: Document lifecycle PostgreSQL integration

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/tests/**"
      - "backend/scripts/**"
      - "backend/pyproject.toml"
      - "backend/alembic.ini"
      - "ci/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/document-lifecycle-postgres.yml"
      - ".github/workflows/postgres-migration-validation.yml"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/tests/**"
      - "backend/scripts/**"
      - "backend/pyproject.toml"
      - "backend/alembic.ini"
      - "ci/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/document-lifecycle-postgres.yml"
      - ".github/workflows/postgres-migration-validation.yml"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  # Preserve real PostgreSQL lifecycle evidence for every exact main revision.
  group: document-lifecycle-postgres-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  document-lifecycle-postgres:
    name: Care spine, documents, Daily Care and handoff on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_document
          POSTGRES_PASSWORD: solenos_document_ci
          POSTGRES_DB: solenos_document
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_document -d solenos_document"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://solenos_document:solenos_document_ci@host.docker.internal:5432/solenos_document
      SOLENOS_COMPANION_TEST_DATABASE_URL: postgresql+psycopg2://solenos_document:solenos_document_ci@host.docker.internal:5432/solenos_document
      SOLENOS_TEST_POSTGRES_RESTART: "1"
      SECRET_KEY: "ci-only-secret-key-long-enough-for-test-runtime"
      APP_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Mark PostgreSQL document lifecycle validation pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "document-lifecycle-postgres-validation",
              description: "PostgreSQL migration, review, restart and duplicate-source integration tests are running",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Build backend CI image with real OCR and test dependencies
        run: docker build -f ci/Dockerfile.backend-tests -t solenos-backend-ci-tests .

      - name: Run PostgreSQL migrations and document lifecycle integration
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          --volume "$GITHUB_WORKSPACE:/workspace"
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume /usr/bin/docker:/usr/bin/docker:ro
          --workdir /workspace
          --env DATABASE_URL="$DATABASE_URL"
          --env SOLENOS_COMPANION_TEST_DATABASE_URL="$SOLENOS_COMPANION_TEST_DATABASE_URL"
          --env SOLENOS_TEST_POSTGRES_RESTART="$SOLENOS_TEST_POSTGRES_RESTART"
          --env SECRET_KEY="$SECRET_KEY"
          --env APP_ENV="$APP_ENV"
          solenos-backend-ci-tests
          bash /workspace/ci/run-document-lifecycle-postgres.sh
      - name: Publish PostgreSQL document lifecycle validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = `${{ job.status }}` === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "document-lifecycle-postgres-validation",
              description: state === "success"
                ? "PostgreSQL document lifecycle, restart and duplicate-source tests passed"
                : "One or more PostgreSQL document lifecycle gates failed",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
