name: Document lifecycle PostgreSQL integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-lifecycle-postgres-${{ github.ref }}
  cancel-in-progress: false

jobs:
  document-lifecycle-postgres:
    name: Care spine, documents, Daily Care and handoff on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_document
          POSTGRES_PASSWORD: solenos_document_ci
          POSTGRES_DB: solenos_document
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_document -d solenos_document"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://solenos_document:solenos_document_ci@host.docker.internal:5432/solenos_document
      SOLENOS_COMPANION_TEST_DATABASE_URL: postgresql+psycopg2://solenos_document:solenos_document_ci@localhost:5432/solenos_document
      SOLENOS_TEST_POSTGRES_RESTART: "1"
      SECRET_KEY: "ci-only-secret-key-long-enough-for-test-runtime"
      APP_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build backend CI image with real OCR and test dependencies
        run: docker build -f ci/Dockerfile.backend-tests -t solenos-backend-ci-tests .

      - name: Run PostgreSQL migrations and document lifecycle integration
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace
          --env DATABASE_URL="$DATABASE_URL"
          --env SOLENOS_COMPANION_TEST_DATABASE_URL="$SOLENOS_COMPANION_TEST_DATABASE_URL"
          --env SOLENOS_TEST_POSTGRES_RESTART="$SOLENOS_TEST_POSTGRES_RESTART"
          --env SECRET_KEY="$SECRET_KEY"
          --env APP_ENV="$APP_ENV"
          solenos-backend-ci-tests
          bash /workspace/ci/run-document-lifecycle-postgres.sh
