# Document ingestion resume regression coverage runs against the current main implementation.
name: Document lifecycle PostgreSQL integration

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/tests/**"
      - "backend/scripts/**"
      - "backend/pyproject.toml"
      - "backend/alembic.ini"
      - "ci/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/document-lifecycle-postgres.yml"
      - ".github/workflows/postgres-migration-validation.yml"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/tests/**"
      - "backend/scripts/**"
      - "backend/pyproject.toml"
      - "backend/alembic.ini"
      - "ci/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - "railway.json"
      - ".dockerignore"
      - ".github/workflows/document-lifecycle-postgres.yml"
      - ".github/workflows/postgres-migration-validation.yml"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  # Keep only the newest main-branch validation queued; obsolete revisions
  # must not starve verification of the current source.
  group: document-lifecycle-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  document-lifecycle-postgres:
    name: Care spine, documents, Daily Care and handoff on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: solenos_document
          POSTGRES_PASSWORD: solenos_document_ci
          POSTGRES_DB: solenos_document
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_document -d solenos_document"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://solenos_document:solenos_document_ci@host.docker.internal:5432/solenos_document
      SOLENOS_COMPANION_TEST_DATABASE_URL: postgresql+psycopg2://solenos_document:solenos_document_ci@host.docker.internal:5432/solenos_document
      SOLENOS_TEST_POSTGRES_RESTART: "1"
      SECRET_KEY: "ci-only-secret-key-long-enough-for-test-runtime"
      APP_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Mark PostgreSQL document lifecycle validation pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "document-lifecycle-postgres-validation",
              description: "PostgreSQL migration, review, restart and duplicate-source integration tests are running",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Build backend CI image with real OCR and test dependencies
        run: docker build -f ci/Dockerfile.backend-tests -t solenos-backend-ci-tests .

      - name: Run PostgreSQL migrations and document lifecycle integration
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          --volume "$GITHUB_WORKSPACE:/workspace"
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume /usr/bin/docker:/usr/bin/docker:ro
          --workdir /workspace
          --env DATABASE_URL="$DATABASE_URL"
          --env SOLENOS_COMPANION_TEST_DATABASE_URL="$SOLENOS_COMPANION_TEST_DATABASE_URL"
          --env SOLENOS_TEST_POSTGRES_RESTART="$SOLENOS_TEST_POSTGRES_RESTART"
          --env SECRET_KEY="$SECRET_KEY"
          --env APP_ENV="$APP_ENV"
          solenos-backend-ci-tests
          bash /workspace/ci/run-document-lifecycle-postgres.sh
      - name: Start pinned S3-compatible storage for real object tests
        run: |
          docker run -d --name solenos-silo \
            --publish 9000:9000 \
            --publish 9001:9001 \
            --env MINIO_ROOT_USER=solenos_ci_minio \
            --env MINIO_ROOT_PASSWORD=solenos_ci_minio_secret_2026 \
            docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329 \
            server /data --console-address ":9001"
          for attempt in $(seq 1 30); do
            if docker exec solenos-silo silo healthcheck ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs solenos-silo
          exit 1
      - name: Verify real S3 ownership, retrieval, checksum and PostgreSQL recovery
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace
          --env DATABASE_URL="$DATABASE_URL"
          --env SECRET_KEY="$SECRET_KEY"
          --env APP_ENV="$APP_ENV"
          --env DOCUMENT_STORAGE_BACKEND=s3
          --env DOCUMENT_S3_ENDPOINT=http://host.docker.internal:9000
          --env DOCUMENT_S3_REGION=us-east-1
          --env DOCUMENT_S3_ACCESS_KEY_ID=solenos_ci_minio
          --env DOCUMENT_S3_SECRET_ACCESS_KEY=solenos_ci_minio_secret_2026
          --env DOCUMENT_S3_BUCKET=solenos-documents
          --env DOCUMENT_S3_ADDRESSING_STYLE=path
          --env AWS_EC2_METADATA_DISABLED=true
          solenos-backend-ci-tests
          python -m pytest backend/tests/test_document_binary_storage_silo_postgres.py -q -vv
      - name: Stop S3-compatible storage
        if: always()
        run: docker rm -f solenos-silo || true
      - name: Publish PostgreSQL document lifecycle validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = `${{ job.status }}` === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "document-lifecycle-postgres-validation",
              description: state === "success"
                ? "PostgreSQL document lifecycle, restart and duplicate-source tests passed"
                : "One or more PostgreSQL document lifecycle gates failed",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
