name: Backend focused regression

on:
  pull_request:
    paths:
      - "backend/app/services/situation.py"
      - "backend/app/core/database.py"
      - "backend/tests/test_situation_authorization.py"
      - "backend/tests/integration_test_runtime_path.py"
      - "backend/pyproject.toml"
      - ".github/workflows/backend-focused-regression.yml"
  push:
    branches:
      - repair/care-data-authorization-baseline

permissions:
  contents: read

jobs:
  situation-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run caregiver/person mismatch regression
        run: python -m pytest -q tests/test_situation_authorization.py
      - name: Run runtime-path integration regressions
        run: python -m pytest -q tests/integration_test_runtime_path.py
