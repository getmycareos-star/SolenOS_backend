name: Consent PostgreSQL persistence

on:
  push:
    branches: [main]
    paths:
      - "backend/app/api/collaboration.py"
      - "backend/app/models/collaboration.py"
      - "backend/tests/test_anonymous_sessions.py"
      - ".github/workflows/consent-postgres-persistence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consent-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_test
          POSTGRES_PASSWORD: solenos_ci_only
          POSTGRES_DB: solenos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_test -d solenos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_test
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend pytest
      - name: Run consent restart and multi-instance regression on PostgreSQL
        run: >-
          python -m pytest
          backend/tests/test_anonymous_sessions.py
          -k 'consent_survives_database_engine_restart_and_is_visible_to_another_instance or consent_isolation_prevents_cross_caregiver_read_and_write'
          -q -vv
