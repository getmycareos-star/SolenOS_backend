name: SolenOS longitudinal reliability

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-benchmark:
    name: Longitudinal benchmark (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      SOLENOS_BENCHMARK_DATABASE_URL: sqlite:///:memory:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend pytest
      - name: Compile backend and benchmark
        run: python -m compileall -q backend/app backend/tests
      - name: Run longitudinal messy-care benchmark
        run: python -m pytest -q backend/tests/test_longitudinal_messy_care_benchmark.py

  postgres-benchmark:
    name: Longitudinal benchmark (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: solenos_test
          POSTGRES_USER: solenos
          POSTGRES_PASSWORD: solenos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos -d solenos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg2://solenos:solenos_test_password@localhost:5432/solenos_test
      SOLENOS_BENCHMARK_DATABASE_URL: postgresql+psycopg2://solenos:solenos_test_password@localhost:5432/solenos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend pytest
      - name: Apply the complete Alembic migration chain
        working-directory: backend
        run: alembic upgrade head
      - name: Run longitudinal messy-care benchmark on migrated PostgreSQL
        run: python -m pytest -q backend/tests/test_longitudinal_messy_care_benchmark.py
