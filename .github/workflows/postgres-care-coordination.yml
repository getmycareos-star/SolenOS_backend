name: PostgreSQL care coordination E2E

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/postgres-care-coordination.yml"

permissions:
  contents: read

jobs:
  postgres-care-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_test
          POSTGRES_PASSWORD: solenos_ci_only
          POSTGRES_DB: solenos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_test -d solenos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and PostgreSQL driver
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend psycopg2-binary httpx
      - name: Install Tesseract OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Create legacy account-oriented caregivers table
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("""
                  CREATE TABLE persons (
                      id VARCHAR PRIMARY KEY,
                      name VARCHAR NOT NULL,
                      date_of_birth DATE,
                      created_at TIMESTAMPTZ DEFAULT now(),
                      updated_at TIMESTAMPTZ
                  )
              """)
              cur.execute("""
                  CREATE TABLE caregivers (
                      id VARCHAR PRIMARY KEY,
                      email VARCHAR UNIQUE,
                      password_hash TEXT,
                      display_name VARCHAR,
                      care_recipient_ids JSONB,
                      role VARCHAR,
                      created_at TIMESTAMPTZ DEFAULT now()
                  )
              """)
          conn.close()
          PY
      - name: Apply complete integrated Alembic chain to PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Verify single head and required care tables
        run: |
          python - <<'PY'
          import os
          import psycopg2
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          backend = os.path.abspath("backend")
          config = Config(os.path.join(backend, "alembic.ini"))
          config.set_main_option("script_location", os.path.join(backend, "alembic"))
          heads = ScriptDirectory.from_config(config).get_heads()
          assert heads == ["t5_handoff_accountability_20261023"], f"Unexpected migration head(s): {heads}"

          required = {
              "persons", "caregivers", "anonymous_sessions", "evidence", "care_events",
              "actions", "care_reminders", "reminder_deliveries", "reminder_delivery_attempts",
              "care_handoffs", "care_handoff_events", "document_assets", "capture_analyses",
              "auth_accounts", "auth_sessions", "auth_account_person_access",
          }
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn.cursor() as cur:
              cur.execute("SELECT table_name FROM information_schema.tables WHERE table_schema='public'")
              tables = {row[0] for row in cur.fetchall()}
              missing = sorted(required - tables)
              assert not missing, f"Integrated PostgreSQL schema missing tables: {missing}"
              cur.execute("SELECT COUNT(*) FROM caregivers")
              assert cur.fetchone()[0] == 0, "Migration fabricated caregiver records"
              cur.execute("SELECT version_num FROM alembic_version")
              assert cur.fetchone()[0] == heads[0], "Database revision does not match migration head"
          conn.close()
          print("PASS: integrated migration graph has one head and required care/document/reminder tables.")
          PY
      - name: Test anonymous care continuity, token rotation, and restart persistence
        working-directory: backend
        run: python scripts/postgres_anonymous_e2e.py
      - name: Test document upload/download, OCR, candidate attribution, and access isolation
        working-directory: backend
        run: python scripts/postgres_document_e2e.py
      - name: Test handoffs, action reminders, delivery receipts, and completion attribution
        working-directory: backend
        run: python scripts/postgres_care_coordination_e2e.py
      - name: Create isolated populated-legacy safety database
        run: |
          python - <<'PY'
          import os
          import psycopg2
          from urllib.parse import urlparse, urlunparse

          parsed = urlparse(os.environ["DATABASE_URL"])
          admin_url = urlunparse(parsed._replace(path="/postgres"))
          conn = psycopg2.connect(admin_url)
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("CREATE DATABASE solenos_legacy_populated")
          conn.close()
          PY
      - name: Verify populated legacy schema fails closed without data loss
        env:
          DATABASE_URL: postgresql://solenos_test:solenos_ci_only@localhost:5432/solenos_legacy_populated
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("""
                  CREATE TABLE persons (
                      id VARCHAR PRIMARY KEY,
                      name VARCHAR NOT NULL,
                      date_of_birth DATE,
                      created_at TIMESTAMPTZ DEFAULT now(),
                      updated_at TIMESTAMPTZ
                  )
              """)
              cur.execute("""
                  CREATE TABLE caregivers (
                      id VARCHAR PRIMARY KEY,
                      email VARCHAR UNIQUE,
                      password_hash TEXT,
                      display_name VARCHAR,
                      care_recipient_ids JSONB,
                      role VARCHAR,
                      created_at TIMESTAMPTZ DEFAULT now()
                  )
              """)
              cur.execute("""
                  INSERT INTO caregivers (id, email, display_name, role)
                  VALUES ('legacy-account-1', 'legacy@example.invalid', 'Legacy account', 'caregiver')
              """)
          conn.close()
          PY
          cd backend
          if python -m alembic upgrade head >/tmp/populated-legacy-migration.log 2>&1; then
            cat /tmp/populated-legacy-migration.log
            echo "Expected populated legacy caregiver schema to fail closed."
            exit 1
          fi
          grep -Eq "reviewed identity mapping" /tmp/populated-legacy-migration.log
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn.cursor() as cur:
              cur.execute("SELECT COUNT(*) FROM caregivers WHERE id='legacy-account-1'")
              assert cur.fetchone()[0] == 1, "legacy account row was changed or deleted"
              cur.execute("""
                  SELECT COUNT(*) FROM information_schema.columns
                  WHERE table_schema='public' AND table_name='caregivers'
                    AND column_name IN ('name','relationship','person_id','timezone')
              """)
              assert cur.fetchone()[0] == 0, "migration altered the populated caregivers table"
          conn.close()
          print("PASS: populated legacy schema failed closed and preserved the original account row.")
          PY
