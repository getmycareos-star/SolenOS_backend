name: Production read-only health verification

on:
  push:
    branches: [main]
    paths:
      - "backend/scripts/run_production_care_verification.py"
      - "backend/app/services/lcr_context.py"
      - ".github/workflows/production-care-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solenos-production-read-only-health
  cancel-in-progress: false

jobs:
  production-readiness:
    name: Read-only production health and schema readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOLENOS_PRODUCTION_API_BASE_URL: https://solenosbackend-production.up.railway.app
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify production health without writing care data
        run: python backend/scripts/run_production_care_verification.py
