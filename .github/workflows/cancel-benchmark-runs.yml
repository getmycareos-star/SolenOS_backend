name: Cancel redundant benchmark runs

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cancel-redundant-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued and running duplicate 10k benchmark jobs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const targets = [];
            for (const status of ["queued", "in_progress"]) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status, per_page: 100 }
              );
              targets.push(...runs.filter((run) =>
                run.name === "Messy-care benchmark gate" &&
                run.head_branch === "main" &&
                run.id !== currentRunId
              ));
            }
            core.info(`Found ${targets.length} redundant main-branch benchmark runs.`);
            for (const run of targets) {
              core.info(`Cancelling ${run.id} at ${run.head_sha} (${run.status}).`);
              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: run.id
              });
            }
            core.info("Cancellation requests submitted.");
