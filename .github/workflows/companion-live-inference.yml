name: Companion live Qwen inference evaluation
# CI-only live Qwen acceptance suite and appointment outcome regression coverage on current main.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/companion-live-inference.yml"
      - "backend/live_tests/test_companion_live_inference.py"
      - "backend/live_tests/test_daily_capture_live_inference.py"
      - "backend/live_tests/test_document_intelligence_live.py"
      - "backend/live_tests/test_appointment_assist_live_inference.py"
      - "backend/tests/test_appointment_workspace.py"
      - "backend/app/api/collaboration.py"
      - "backend/app/api/companion_review.py"
      - "backend/app/api/daily_care_intelligence.py"
      - "backend/app/api/document_intelligence.py"
      - "backend/app/api/appointment_workspace.py"
      - "backend/app/api/handoff_drafts.py"
      - "backend/app/api/handoffs.py"
      - "backend/models/privacy_delivery.py"
      - "backend/tests/test_privacy_delivery.py"
      - "backend/app/services/care_continuity.py"
      - "backend/app/schemas/care_continuity.py"
      - "backend/app/api/v1.py"
      - "backend/app/main.py"
      - "backend/app/services/unified_lcr_retrieval.py"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: companion-live-qwen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-qwen-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_live
          POSTGRES_PASSWORD: solenos_live_ci
          POSTGRES_DB: solenos_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_live -d solenos_live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://solenos_live:solenos_live_ci@localhost:5432/solenos_live
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3.5:4b
      OLLAMA_TIMEOUT_SECONDS: "180"
      OLLAMA_NUM_CTX: "1024"
      OLLAMA_NUM_PREDICT: "96"
      OLLAMA_NUM_THREADS: "2"
      SOLENOS_RUN_LIVE_QWEN_EVAL: "1"
      SOLENOS_RUN_APPOINTMENT_ASSIST_LIVE_EVAL: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and PostgreSQL test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx 'psycopg[binary]'
      - name: Apply complete Alembic migration chain
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Start isolated Ollama runtime
        run: |
          docker run -d --name solenos-live-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs solenos-live-ollama
          exit 1
      - name: Download the configured Qwen model
        run: docker exec solenos-live-ollama ollama pull "$OLLAMA_MODEL"
      - name: Run real Qwen Companion inference against PostgreSQL
        run: python -m pytest backend/live_tests/test_companion_live_inference.py -q -s
      - name: Run real Qwen Daily Capture extraction and persistence against PostgreSQL
        run: python -m pytest backend/live_tests/test_daily_capture_live_inference.py -q -s
      - name: Run real Qwen document extraction and review against PostgreSQL
        run: python -m pytest backend/live_tests/test_document_intelligence_live.py -q -s
      - name: Run real Qwen appointment assistance against PostgreSQL
        run: python -m pytest backend/live_tests/test_appointment_assist_live_inference.py -q -s
      - name: Stop isolated Ollama runtime
        if: always()
        run: docker rm -f solenos-live-ollama || true
