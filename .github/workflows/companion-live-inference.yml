name: Companion live Qwen inference evaluation
# CI-only live Qwen acceptance suite and appointment outcome regression coverage on current main.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/companion-live-inference.yml"
      - "backend/app/services/qwen*"
      - "backend/app/services/delta_engine.py"
      - "backend/app/services/situation.py"
      - "backend/app/schemas/situation.py"
      - "backend/tests/test_daily_capture.py"
      - "backend/app/api/collaboration.py"
      - "backend/app/api/care_continuity.py"
      - "backend/app/models/care_continuity.py"
      - "backend/app/services/lcr_context.py"
      - "backend/app/services/unified_lcr_retrieval.py"
      - "backend/tests/test_caregiver_context_routes.py"
      - "backend/tests/test_pattern_postgres_integration.py"
      - "backend/tests/test_unified_lcr_retrieval.py"
      - "backend/app/api/handoff_drafts.py"
      - "backend/app/main.py"
      - "backend/tests/test_situation.py"
      - "backend/tests/test_companion_response_contract.py"
      - "backend/app/api/companion_review.py"
      - "backend/live_tests/**"
      - "backend/tests/test_companion_care_update_postgres.py"
      - "backend/tests/test_qwen_background_worker.py"
      - "backend/tests/test_qwen_startup_script.py"
      - "backend/tests/test_qwen_retry_budget.py"
      - "backend/tests/test_handoff_drafts.py"
      - "backend/app/api/document_intelligence.py"
      - "backend/app/api/document_lifecycle.py"
      - "backend/app/services/document_candidate_schema.py"
      - "backend/app/services/care_continuity_execution.py"
      - "backend/app/services/change_intelligence_reconciliation.py"
      - "backend/app/services/delta_engine.py"
      - "backend/tests/test_document_candidate_schema.py"
      - "backend/tests/test_document_lifecycle.py"
      - "backend/tests/fixtures/document_intelligence_semantic_eval.json"
      - "backend/tests/test_document_candidate_adversarial.py"
      - "backend/tests/test_document_intelligence_lifecycle.py"
      - "backend/tests/test_document_intelligence_postgres.py"
      - "backend/live_tests/test_document_intelligence_live.py"
      - "start-with-qwen.sh"
permissions:
  contents: read

concurrency:
  group: companion-live-qwen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-qwen-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_live
          POSTGRES_PASSWORD: solenos_live_ci
          POSTGRES_DB: solenos_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_live -d solenos_live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://solenos_live:solenos_live_ci@localhost:5432/solenos_live
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3.5:4b
      OLLAMA_TIMEOUT_SECONDS: "180"
      # Match the 4,096-token runner context observed in Railway production.
      # The deployed 4B model peaked at about 7.42 GB against an 8 GB service limit;
      # do not make CI pass with a larger context than production can safely run.
      OLLAMA_NUM_CTX: "4096"
      OLLAMA_NUM_PREDICT: "96"
      OLLAMA_NUM_THREADS: "2"
      SOLENOS_RUN_LIVE_QWEN_EVAL: "1"
      SOLENOS_RUN_APPOINTMENT_ASSIST_LIVE_EVAL: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install local OCR engine for real document extraction tests
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and PostgreSQL test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx 'psycopg[binary]'
      - name: Apply complete Alembic migration chain
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run real PDF, scanned PDF, image, DOCX and extraction recovery tests
        run: python -m pytest backend/tests/test_document_lifecycle.py -q
      - name: Run document semantic and lifecycle regression tests
        run: python -m pytest backend/tests/test_document_candidate_schema.py backend/tests/test_document_candidate_adversarial.py backend/tests/test_document_intelligence_lifecycle.py -q
      - name: Run PostgreSQL document persistence, review, duplicate and restart integration tests
        env:
          SOLENOS_TEST_POSTGRES_RESTART: "1"
        run: python -m pytest backend/tests/test_document_intelligence_postgres.py -q -s
      - name: Run bounded Qwen startup retry regression tests
        run: python -m pytest backend/tests/test_qwen_retry_budget.py -q
      - name: Start isolated Ollama runtime
        id: ollama
        run: |
          docker run -d --name solenos-live-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs solenos-live-ollama
          exit 1
      - name: Download the configured Qwen model
        id: qwen_model
        run: docker exec solenos-live-ollama ollama pull "$OLLAMA_MODEL"
      - name: Run real Qwen document extraction and review against PostgreSQL
        id: qwen_document
        continue-on-error: true
        if: ${{ always() && steps.ollama.outcome == 'success' && steps.qwen_model.outcome == 'success' }}
        run: python -m pytest backend/live_tests/test_document_intelligence_live.py -q -s
      - name: Run real Qwen inference across every enabled workflow against PostgreSQL
        id: qwen_workflows
        continue-on-error: true
        if: ${{ always() && steps.ollama.outcome == 'success' && steps.qwen_model.outcome == 'success' }}
        run: python -m pytest backend/live_tests/test_all_qwen_workflows_live.py -q -s
      - name: Run real Qwen Companion inference against PostgreSQL
        id: qwen_companion
        continue-on-error: true
        if: ${{ always() && steps.ollama.outcome == 'success' && steps.qwen_model.outcome == 'success' }}
        run: python -m pytest backend/live_tests/test_companion_live_inference.py -q -s
      - name: Run real Qwen Daily Capture extraction and persistence against PostgreSQL
        id: qwen_daily_capture
        continue-on-error: true
        if: ${{ always() && steps.ollama.outcome == 'success' && steps.qwen_model.outcome == 'success' }}
        run: python -m pytest backend/live_tests/test_daily_capture_live_inference.py -q -s
      - name: Run real Qwen appointment assistance against PostgreSQL
        id: qwen_appointment
        continue-on-error: true
        if: ${{ always() && steps.ollama.outcome == 'success' && steps.qwen_model.outcome == 'success' }}
        run: python -m pytest backend/live_tests/test_appointment_assist_live_inference.py -q -s
      - name: Enforce every real-Qwen acceptance suite
        if: always()
        env:
          DOCUMENT_OUTCOME: ${{ steps.qwen_document.outcome || 'not_run' }}
          WORKFLOWS_OUTCOME: ${{ steps.qwen_workflows.outcome || 'not_run' }}
          COMPANION_OUTCOME: ${{ steps.qwen_companion.outcome || 'not_run' }}
          DAILY_CAPTURE_OUTCOME: ${{ steps.qwen_daily_capture.outcome || 'not_run' }}
          APPOINTMENT_OUTCOME: ${{ steps.qwen_appointment.outcome || 'not_run' }}
        run: |
          failed=0
          for suite in DOCUMENT WORKFLOWS COMPANION DAILY_CAPTURE APPOINTMENT; do
            variable_name="${suite}_OUTCOME"
            outcome="$(printenv "$variable_name")"
            printf '%s: %s\n' "$suite" "$outcome"
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          exit "$failed"
      - name: Stop isolated Ollama runtime
        if: always()
        run: docker rm -f solenos-live-ollama || true
