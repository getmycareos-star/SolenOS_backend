name: Companion live Qwen inference evaluation

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/qwen_gateway.py"
      - "backend/app/api/collaboration.py"
      - "backend/app/api/companion_review.py"
      - "backend/app/services/companion_care_updates.py"
      - "backend/live_tests/test_companion_live_inference.py"
      - ".github/workflows/companion-live-inference.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile"
      - "start-with-qwen.sh"
      - ".github/workflows/companion-live-inference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-live-qwen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-qwen-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_live_ci
          POSTGRES_PASSWORD: solenos_live_ci
          POSTGRES_DB: solenos_live_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_live_ci -d solenos_live_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3.5:4b
      OLLAMA_TIMEOUT_SECONDS: "180"
      OLLAMA_NUM_CTX: "1024"
      OLLAMA_NUM_PREDICT: "96"
      OLLAMA_NUM_THREADS: "2"
      SOLENOS_RUN_LIVE_QWEN_EVAL: "1"
      DATABASE_URL: postgresql+psycopg2://solenos_live_ci:solenos_live_ci@127.0.0.1:5432/solenos_live_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend pytest httpx psycopg2-binary
      - name: Apply reviewed PostgreSQL migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Start isolated Ollama runtime
        run: |
          docker run -d --name solenos-live-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs solenos-live-ollama
          exit 1
      - name: Download the default-model candidate under test
        run: docker exec solenos-live-ollama ollama pull "$OLLAMA_MODEL"
      - name: Run live Companion inference evaluation
        run: python -m pytest backend/live_tests/test_companion_live_inference.py backend/live_tests/test_document_intelligence_live.py backend/live_tests/test_daily_capture_live_inference.py -q -s
      - name: Stop isolated Ollama runtime
        if: always()
        run: docker rm -f solenos-live-ollama || true
