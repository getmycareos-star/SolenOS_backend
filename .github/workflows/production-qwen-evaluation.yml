name: Deployed Qwen production acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deployed-qwen-production-acceptance
  cancel-in-progress: false

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      SOLENOS_PRODUCTION_API_BASE_URL: https://solenosbackend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify workflow identity is available
        run: |
          test -n "$GITHUB_TOKEN"
          test -n "$GITHUB_RUN_ID"
      - name: Run acceptance tests against deployed model
        run: python backend/scripts/run_production_qwen_evaluation.py
