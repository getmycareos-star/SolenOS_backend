name: Backend validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest httpx
      - name: Compile backend
        run: python -m compileall -q app
      - name: Smoke-test ASGI startup and health
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8011 >/tmp/solenos-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8011/health && curl --silent --fail http://127.0.0.1:8011/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/solenos-uvicorn.log
          exit 1
      - name: Run backend tests
        run: pytest -q

  deployed-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed service health and database readiness
        timeout-minutes: 16
        run: |
          base='https://solenosbackend-production.up.railway.app'
          ready=0
          for attempt in $(seq 1 48); do
            health=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${base}/health" || true)
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${base}/ready" || true)
            echo "Attempt ${attempt}: /health HTTP ${health}; /ready HTTP ${status}"
            if [ "$health" = "200" ] && [ "$status" = "200" ]; then ready=1; break; fi
            sleep 20
          done
          test "$ready" = "1"

      - name: Verify deployed Railway-local Qwen model inventory without creating care records
        timeout-minutes: 12
        shell: bash
        run: |
          base='https://solenosbackend-production.up.railway.app'
          available=0
          for attempt in $(seq 1 36); do
            status=$(curl --silent --show-error --output /tmp/qwen-status.json --write-out '%{http_code}' --max-time 20 "${base}/api/v1/assistant/status" || true)
            if [ "$status" = "200" ] && python - <<'PY'
          import json
          with open("/tmp/qwen-status.json", encoding="utf-8") as stream:
              data = json.load(stream)
          assert data.get("available") is True, data
          assert data.get("model") == "qwen2.5:0.5b", data
          assert data.get("provider") == "local_ollama", data
          assert data.get("hosted_inference_api") is False, data
          print("PASS: Railway reports the bundled local qwen2.5:0.5b model as available.")
          PY
            then available=1; break; fi
            echo "Qwen runtime not yet ready (HTTP ${status}); retrying."
            sleep 15
          done
          test "$available" = "1"

      - name: Verify deployed OpenAPI exposes core continuity routes
        run: |
          curl --silent --show-error --fail --max-time 20 'https://solenosbackend-production.up.railway.app/openapi.json' -o /tmp/solenos-openapi.json
          python - <<'PY'
          import json
          with open("/tmp/solenos-openapi.json", encoding="utf-8") as stream:
              paths = set(json.load(stream).get("paths", {}))
          required = {
              "/api/v1/sessions/anonymous",
              "/api/v1/sessions/refresh",
              "/api/v1/evidence/{person_id}",
              "/api/situation",
              "/api/v1/share-intake",
              "/api/v1/share-intake/{share_id}",
              "/api/v1/assistant/status",
              "/api/v1/assistant/assist",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"Deployed OpenAPI is missing core continuity routes: {missing}")
          print("PASS: deployed OpenAPI exposes anonymous sessions, refresh, evidence reads, and care capture.")
          PY
      - name: Diagnose deployed route paths
        if: always()
        shell: bash
        run: |
          base='https://solenosbackend-production.up.railway.app'
          for path in /health /ready /api/health /api/v1/health /openapi.json /docs /; do
            status=$(curl --silent --show-error --output /tmp/solenos-response --write-out '%{http_code}' --max-time 20 "${base}${path}" || true)
            printf '%-18s HTTP %s\n' "$path" "$status"
            if [ "$path" = "/openapi.json" ] && [ "$status" = "200" ]; then
              python -c 'import json; d=json.load(open("/tmp/solenos-response")); print("OpenAPI paths:", ", ".join(sorted(d.get("paths", {}).keys())[:60]))'
            fi
          done
      - name: Verify deployed API CORS preflight
        if: always()
        shell: bash
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 -X OPTIONS 'https://solenosbackend-production.up.railway.app/api/situation' -H 'Origin: https://solenosai.netlify.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type')
          echo "OPTIONS /api/situation returned HTTP $status"
          test "$status" = "200"
