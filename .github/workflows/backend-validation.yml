# Re-run validation against the current document-intelligence and handoff branch head.
name: Backend validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest httpx
      - name: Compile backend
        run: python -m compileall -q app
      - name: Smoke-test ASGI startup and health
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8011 >/tmp/solenos-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8011/health && curl --silent --fail http://127.0.0.1:8011/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/solenos-uvicorn.log
          exit 1
      - name: Run backend tests
        run: pytest -q

  deployed-smoke:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the latest deployable main source commit to be live and database-ready
        run: |
          base='https://solenosbackend-production.up.railway.app'
          # Railway watches application and migration paths, not workflow-only commits.
          # Compare readiness against the latest commit that changed deployable source.
          expected_commit=$(git log -1 --format=%H -- Dockerfile backend/app backend/alembic backend/pyproject.toml backend/alembic.ini start-with-qwen.sh)
          test -n "$expected_commit"
          ready=0
          for attempt in $(seq 1 48); do
            health=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${base}/health" || true)
            ready_json=$(curl --silent --show-error --fail --max-time 20 "${base}/ready" 2>/dev/null || true)
            status=0
            migration_state=""
            continuity_schema=""
            migration_head=""
            deployment_commit=""
            if [ -n "$ready_json" ]; then
              status=200
              migration_state=$(printf '%s' "$ready_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("migration_state",""))' 2>/dev/null || true)
              continuity_schema=$(printf '%s' "$ready_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("continuity_schema",""))' 2>/dev/null || true)
              migration_head=$(printf '%s' "$ready_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("migration_head",""))' 2>/dev/null || true)
              deployment_commit=$(printf '%s' "$ready_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("deployment_commit") or "")' 2>/dev/null || true)
            else
              status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${base}/ready" || true)
            fi
            openapi=$(curl --silent --show-error --fail --max-time 20 "${base}/openapi.json" 2>/dev/null || true)
            has_lcr_routes=0
            if printf '%s' "$openapi" | grep -q '/api/v1/care-continuity/record-versions' &&
               printf '%s' "$openapi" | grep -q '/api/v1/care-continuity/record-snapshots'; then
              has_lcr_routes=1
            fi
            echo "Attempt ${attempt}: /health HTTP ${health}; /ready HTTP ${status}; migration_state=${migration_state}; migration_head=${migration_head}; continuity_schema=${continuity_schema}; deployment_commit=${deployment_commit}; expected_commit=${expected_commit}; LCR version routes present: ${has_lcr_routes}"
            # Do not accept an older healthy service: the running process must
            # identify the exact commit whose main-branch checks are executing.
            if [ "$health" = "200" ] && [ "$status" = "200" ] && [ "$migration_state" = "current" ] && [ "$continuity_schema" = "verified" ] && [ -n "$migration_head" ] && [ "$has_lcr_routes" = "1" ] && [ "$deployment_commit" = "$expected_commit" ]; then ready=1; break; fi
            sleep 20
          done
          test "$ready" = "1"

      # Qwen runtime readiness is intentionally not a deployment gate while work is focused on care continuity.
      - name: Verify deployed OpenAPI exposes core continuity routes
        run: |
          curl --silent --show-error --fail --max-time 20 'https://solenosbackend-production.up.railway.app/openapi.json' -o /tmp/solenos-openapi.json
          python - <<'PY'
          import json
          with open("/tmp/solenos-openapi.json", encoding="utf-8") as stream:
              paths = set(json.load(stream).get("paths", {}))
          required = {
              "/api/v1/sessions/anonymous",
              "/api/v1/sessions/refresh",
              "/api/v1/evidence/{person_id}",
              "/api/situation",
              "/api/v1/share-intake",
              "/api/v1/share-intake/{share_id}",
              "/api/v1/assistant/status",
              "/api/v1/assistant/assist",
              "/api/v1/care-continuity/record-versions",
              "/api/v1/care-continuity/record-snapshots",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"Deployed OpenAPI is missing core continuity routes: {missing}")
          print("PASS: deployed OpenAPI exposes anonymous sessions, refresh, evidence reads, and care capture.")
          PY
      - name: Diagnose deployed route paths
        if: always()
        shell: bash
        run: |
          base='https://solenosbackend-production.up.railway.app'
          for path in /health /ready /api/health /api/v1/health /openapi.json /docs /; do
            status=$(curl --silent --show-error --output /tmp/solenos-response --write-out '%{http_code}' --max-time 20 "${base}${path}" || true)
            printf '%-18s HTTP %s\n' "$path" "$status"
            if [ "$path" = "/openapi.json" ] && [ "$status" = "200" ]; then
              python -c 'import json; d=json.load(open("/tmp/solenos-response")); print("OpenAPI paths:", ", ".join(sorted(d.get("paths", {}).keys())[:60]))'
            fi
          done
      - name: Verify deployed API CORS preflight
        if: always()
        shell: bash
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 -X OPTIONS 'https://solenosbackend-production.up.railway.app/api/situation' -H 'Origin: https://solenosai.netlify.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type')
          echo "OPTIONS /api/situation returned HTTP $status"
          test "$status" = "200"

  container-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solenos_container_ci
          POSTGRES_PASSWORD: solenos_container_ci
          POSTGRES_DB: solenos_container_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solenos_container_ci -d solenos_container_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://solenos_container_ci:solenos_container_ci@127.0.0.1:5432/solenos_container_ci
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build --tag solenos-backend-ci:latest .
      - name: Verify production image starts and becomes ready against migrated PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --detach --name solenos-backend-ci --network host \
            --env APP_ENV=ci \
            --env DATABASE_URL="$DATABASE_URL" \
            --env SECRET_KEY=ci-only-not-for-production \
            --env OLLAMA_SIDECAR_ENABLED=false \
            --env OLLAMA_BASE_URL=http://127.0.0.1:9 \
            --env OLLAMA_HOST=127.0.0.1:9 \
            solenos-backend-ci:latest
          cleanup() {
            docker logs --tail 60 solenos-backend-ci 2>&1 | cut -c1-600 | tail -c 12000 >&2 || true
            docker rm --force solenos-backend-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready_response=""
          for attempt in $(seq 1 45); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail --max-time 5 http://127.0.0.1:8080/health >/dev/null; then
            echo "FAIL: production image did not start /health." >&2
            exit 1
          fi
          docker exec solenos-backend-ci alembic -c /app/alembic.ini upgrade head
          for attempt in $(seq 1 45); do
            ready_response=$(curl --silent --show-error --max-time 10 http://127.0.0.1:8080/ready || true)
            if curl --silent --fail --max-time 10 http://127.0.0.1:8080/ready >/dev/null; then
              echo "PASS: production image serves /ready against fully migrated PostgreSQL."
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: production image did not become ready against PostgreSQL." >&2
          printf 'Last /ready response: %s\n' "$ready_response" >&2
          exit 1
