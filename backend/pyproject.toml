[project]
name = "solenos-backend"
version = "0.1.0"
description = "SolenOS: Trust-first living care record"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pypdf>=4.0.0",
    # Writes the Living Care Summary PDF. Local-only, no network calls: the
    # summary contains a person's care record and must never leave the machine.
    "reportlab>=4.0.0",
    "sentry-sdk>=2.0.0",
    # Prometheus metrics endpoint
    "prometheus-client>=0.19.0",
    # Asynchronous processing dependencies
    "redis>=4.5.0",
    "celery>=5.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "hypothesis>=6.100.0",
    "pytest-timeout>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

